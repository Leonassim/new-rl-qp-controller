  # document de calibration, joint_vel par difference finie des positions, et un
  # historique 5 sur les actions.
  #
  # OBSERVATION 246 DIMS, batie par utils.cpp case 1 : le corps commun sans
  # gait_phase ni raw_torque. 15+3+3+30+30+150+15 = 246.
  #
  # Deux valeurs seulement different de l'index 2, et ce sont celles qui font le
  # retour a la base :
  #   action_scale des jambes = 1.5 * effort_limit/stiffness, contre 7x pour
  #     abl7/abl15. Le genou tombe a 0.00525 : il etait a 0.0075 du temps de la
  #     policy 0, dont l'effort_limit valait 100, abaisse depuis a 70.
