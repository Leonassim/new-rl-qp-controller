    max_vel_y: 0.4
    max_yaw: 0.45
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5

    # Torque-feasibility projection (mirrors mjlab's FiniteDifferencePdActuator).
    # Active only when torque_feasibility_ratio is set. This policy trained WITH
    # it, so without it here the plant differs from the one it learned on --
    # visibly so in transients. This run measured raw_torque_peak_mean 1.019 and
