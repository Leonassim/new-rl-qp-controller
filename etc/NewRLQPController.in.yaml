---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# This block is the ONLY thing that actually puts a self-collision constraint
# in the solver: MCController.cpp:322-331 builds a CollisionsConstraint from
# the "collisions" key and calls solver().addConstraintSet() on it. The
# selfCollisionConstraint member tweaked in NewRLQPController's constructor
# (thigh iDist correction, setCollisionsDampers) is a SEPARATE object that is
# never added to the solver, so editing it there changes nothing -- and
# commenting this block out is what actually disables the protection.
#
# Briefly disabled on 2026-08-07 to test whether self-collision explained the
# QP-vs-bypass gap. It did not; restored.
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences
    # WAIKO estimator: IMU + legged odometry (no QP contacts needed).
    # imuSensor must be the real IMU (Accelerometer, gyro+accelero at the imu
    # site) -- FloatingBase is the mc_mujoco ground-truth pose sensor.
    # filterGains/leggedOdometry come from the installed default MCWaiko.yaml.
    - type: MCWaiko
      update: true
      gui: true
      imuSensor: Accelerometer
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # Ground-truth fallback (mc_mujoco perfect pose), for comparison:
    # - type: BodySensor
    #   update: true
    #   gui: true
    #   bodySensor: FloatingBase

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Toutes les politiques sont EMBARQUEES : les fichiers vivent dans policy/ et
# CMake installe le repertoire entier vers @RL_POLICY_INSTALL_PREFIX@. Aucun
# chemin absolu vers le home de qui que ce soit, donc un clone + build sur le PC
# du robot a les politiques sans avoir mjlab-hrp5p nulle part.
#
# Cette branche `hrp5p` ne porte que HRP5P : les entrees RHPS1 (trois
# policies, x_shared_plant, joint_torque_scale) sont parties le jour de la
# creation de cette branche, meme geste que RHP7 retirant RHPS1 sur `rhp7` le
# 2026-09-01 -- les deux robots ne peuvent de toute facon pas coexister a
# l'execution (MainRobot est fige au demarrage de mc_rtc, et les maps
# kp/kd/q0/effort_limit sont lues en .at() contre le refJointOrder du robot
# charge, donc un index de l'autre robot leve std::out_of_range dans
# initializeRobot()). Recuperables sur `real-robot-safe`/l'historique git.
#
# ARMER DEPUIS LA GUI, une main sur l'arret. Aucune de ces policies n'a encore
# tourne, ni en simulation ni sur le robot.
policy_path: [
  "@RL_POLICY_INSTALL_PREFIX@/model_5000.onnx",
]
# Une seule entree -- le defaut n'a rien d'autre a porter. Exige
# MainRobot: HRP5P dans mc_rtc.yaml (module mc_hrp5_p).
default_policy_index: 0

policies:
  # index 0 (seule entree) : HRP5P, velocity-action -- premiere integration,
  # jamais testee (ni sim ni robot). Exige MainRobot: HRP5P (module
  # mc_hrp5_p, construit dans le superbuild avec WITH_HRP5 ON) sous peine de
  # std::out_of_range dans initializeRobot() (les maps kp/kd/q0/effort_limit
  # ci-dessous sont lues avec .at() sur le refJointOrder du robot charge --
  # les 53 joints, pas seulement les 33 pilotes par la policy, cf. le
  # commentaire sur effort_limit plus bas).
  #
  # 33 joints actionnes par ref_joint_order (RCY..LWRP), ordre confirme
  # directement dans les metadonnees embarquees de policy/model_5000.onnx
  # (joint_names / action_scale) -- PAS celui de hrp5_constants.py
  # (HRP5P_ACTUATORS a un ordre bras-gauche incoherent avec l'onnx reel,
  # WRY avant EP au lieu de EP avant WRY).
  #
  # obs_format: 8 -- l'onnx attend une entree [1, 2220] = 20 * (3+3+3+33+33+33+3),
  # donc un historique profondeur 20 sur les sept termes (base_lin_vel,
  # base_ang_vel, projected_gravity, joint_pos, joint_vel, actions, command),
  # confirme par onnxruntime (InferenceSession(...).get_inputs()) ET par
  # mjlab/tasks/velocity/velocity_env_cfg_hrp5.py:93 (history_length=20).
  # Chaque frame correspond a un pas de policy (policyStepSize, PAS timeStep) :
  # utils.cpp ne pousse l'historique que dans le bloc `if(newInference)`
  # (une fois par policy_step_size), qui tombe a 100 Hz ici -- exactement le
  # rythme d'un pas d'env mjlab (decimation 4 * timestep 0.0025 = 0.01s).
  # Implemente dans utils.cpp `case 8:` (fallthrough vers le corps generique
  # partage avec l'ancien `case 2:` RHPS1) et V3_DEEP_HISTORY_SIZE a 20 dans
  # NewRLQPController.h -- sans consequence sur RHPS1 puisque cette branche ne
  # le porte plus. NE PAS ARMER avant un premier test simulation.
  - use_QP: true
    obs_format: 8
    velocity_action: true
    use_torque_task: false
    qp_accel_task: false
    joint_armature: 1.0
    policy_step_size: 0.01     # 100 Hz (10 ms) -- decimation 4 * timestep 0.0025,
                                # mjlab/tasks/velocity/velocity_env_cfg_hrp5.py
    physics_step_size: 0.0025  # mc_mujoco a 400 Hz (2.5 ms)
    pd_gains_ratio: 1.0
    posture_stiffness: 1600
    max_vel_x: 0.3
    max_vel_y: 0.2
    max_yaw: 0.45
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5
    torque_feasibility_ratio: 1.0
    vel_target_filter_alpha: 0.8

    # Delai d'actionneur FIXE pour ce deploiement sim-in-sim (rl_controller +
    # mc_mujoco), demande explicitement plutot que de laisser le delai
    # randomise de l'entrainement (mjlab IdealPdActuatorCfg
    # actuation_delay_min_lag/actuation_delay_max_lag, pd_actuator.py : un
    # DelayBuffer resample par env, garde a actuation_delay_hold_prob du
    # temps). Ici : un seul deploiement, donc un seul delai constant en ms,
    # converti en pas de controleur (timeStep, PAS policy_step_size ni
    # physics_step_size) dans NewRLQPController::configRL(). 40ms / 0.005s
    # (Timestep de mc_rtc.yaml) = 8 pas. Applique entre q_rl/qdTarget_ et la
    # cible de la PostureTask (delayedQRl_()/delayedQdTarget_() dans
    # NewRLQPController.cpp), au meme endroit que le DelayBuffer de mjlab
    # (apres l'anti-windup, juste avant l'erreur de PD).
    #
    # L'entrainement randomise ce delai entre actuation_delay_min_lag=14 et
    # actuation_delay_max_lag=22 (hrp5_constants.py), soit 35-55 ms a 400 Hz.
    # Un 40 ms fixe avait donc ete choisi ici, au milieu de cette plage.
    #
    # Remis a 0 : mesure par correlation croisee sur le log du 2026-09-24
    # 13:06 (115 s de marche, regime etabli), la sortie du QP suit q_rl avec
    # 5-10 ms de retard seulement, pas les 40 configures -- le QP en annule
    # ~30. Verifie que ce n'etait ni le binaire (le code du retard y est), ni
    # le YAML installe, ni le clamp anti-windup (il ne borne que 4.5% du
    # temps), ni setPostureRefAccel (posture_passthrough absent donc false),
    # ni le filtre de la PostureTask (-0.7 deg de dephasage a 1.2 Hz). Cause
    # non identifiee. A 0 vs 120 ms on saura si l'estimateur est biaise ou
    # s'il y a un vrai bug entre la PostureTask et la sortie du QP.
    actuation_delay_ms: 0.0

    # effort_limit reels des HRP5P_ACTUATOR_* d'entrainement
    # (mjlab/asset_zoo/robots/hrp5/hrp5_constants.py), utilises pour deriver
    # action_scale par la meme formule que RHP7 (e / (3*(kp*0.01+kd))) --
    # recoupe chiffre par chiffre avec policy/model_5000.onnx (metadata action_scale).
    effort_limit: &hrp5p_effort_limit
      RCY:  200
      RCR:  500
      RCP:  500
      RKP:  1200
      RAP:  250
      RAR:  200
      LCY:  200
      LCR:  500
      LCP:  500
      LKP:  1200
      LAP:  250
      LAR:  200
      WP:   900
      WR:   900
      WY:   250
      HY:   45
      HP:   45
      RSC:  200
      RSP:  400
      RSR:  350
      RSY:  200
      REP:  400
      RWRY: 300
      RWRR: 300
      RWRP: 120
      LSC:  200
      LSP:  400
      LSR:  350
      LSY:  200
      LEP:  400
      LWRY: 300
      LWRR: 300
      LWRP: 120
      # Joints hors ref_joint_order (mc_hrp5_p::refJointOrder() en a 53, la
      # policy n'en pilote que 33) -- necessaires quand meme, kp/kd/q0/
      # effort_limit sont lus avec .at() sur TOUS les joints du robot charge,
      # pas seulement ceux de ref_joint_order (NewRLQPController.cpp:373-380).
      # Non entraines : jamais dans currentAction, donc q_rl y reste fige a
      # q0 en permanence (personne ne l'ecrit), tenu par la PostureTask a
      # kp/kd ci-dessous -- une pose statique, pas une commande RL. effort_limit
      # = ctrlrange * gear du <motor> MJCF (HRP5Pmain.xml), pas une valeur
      # d'entrainement (ces joints n'en ont pas) : RHDY/LHDY 0.113*300=33.9,
      # doigts 0.062*623.27=38.64.
      RHDY: 33.9
      LHDY: 33.9
      RTMP:  38.64
      RTPIP: 38.64
      RTDIP: 38.64
      RIMP:  38.64
      RIPIP: 38.64
      RIDIP: 38.64
      RMMP:  38.64
      RMPIP: 38.64
      RMDIP: 38.64
      LTMP:  38.64
      LTPIP: 38.64
      LTDIP: 38.64
      LIMP:  38.64
      LIPIP: 38.64
      LIDIP: 38.64
      LMMP:  38.64
      LMPIP: 38.64
      LMDIP: 38.64

    # Valeurs conservatrices choisies a la main (pas mesurees), memes
    # proportions que le bloc RHP7 (jambes/taille plus permissives que
    # bras/tete) -- a resserrer/relacher apres un premier essai.
    vel_target_limit_per_joint: &hrp5p_vel_target_limit_per_joint
      RCY:  8
      RCR:  8
      RCP:  8
      RKP:  10
      RAP:  10
      RAR:  10
      LCY:  8
      LCR:  8
      LCP:  8
      LKP:  10
      LAP:  10
      LAR:  10
      WP:   8
      WR:   8
      WY:   8
      HY:   4
      HP:   4
      RSC:  6
      RSP:  6
      RSR:  6
      RSY:  6
      REP:  6
      RWRY: 6
      RWRR: 6
      RWRP: 6
      LSC:  6
      LSP:  6
      LSR:  6
      LSY:  6
      LEP:  6
      LWRY: 6
      LWRR: 6
      LWRP: 6
      # Hors ref_joint_order (cf. commentaire sur effort_limit ci-dessus) --
      # optionnel en pratique (updateIfExists, pas de .at()), mais explicite
      # ici pour rester coherent avec le reste du fichier.
      RHDY: 4
      LHDY: 4
      RTMP:  4
      RTPIP: 4
      RTDIP: 4
      RIMP:  4
      RIPIP: 4
      RIDIP: 4
      RMMP:  4
      RMPIP: 4
      RMDIP: 4
      LTMP:  4
      LTPIP: 4
      LTDIP: 4
      LIMP:  4
      LIPIP: 4
      LIDIP: 4
      LMMP:  4
      LMPIP: 4
      LMDIP: 4

    # HRP5P_ACTION_SCALE du run d'entrainement (mjlab hrp5_constants.py),
    # pleine precision (memes valeurs e/(3*(kp*0.01+kd)) que la policy
    # precedente pour jambes/taille -- inchangees -- mais bras/tete
    # desormais *0.3 au lieu de *0.5, hrp5_constants.py:738, pour cette
    # policy entrainee avec le delai d'actionneur randomise). Recoupe avec
    # les metadonnees action_scale de policy/model_5000.onnx (arrondies a 3
    # decimales) : les 33 entrees concordent.
    action_scale: &hrp5p_action_scale
      RCY:  0.6172839506172839
      RCR:  0.7163836904085618
      RCP:  0.5208333333333334
      RKP:  0.5555555555555556
      RAP:  0.5208333333333334
      RAR:  1.4854426442369588
      LCY:  0.6172839506172839
      LCR:  0.7163836904085618
      LCP:  0.5208333333333334
      LKP:  0.5555555555555556
      LAP:  0.5208333333333334
      LAR:  1.4854426442369588
      # WP/RSP/LSP/RWRR/LWRR ne sont plus fixes par la saturation de
      # l'actionneur mais par un plafond de COURSE ajoute dans hrp5_constants.py
      # (0.4 s minimum pour traverser le plus court debattement depuis q0). WP
      # passe de 1.875 a 0.5236 : avec l'ancienne valeur, une action de 1
      # epuisait ses 12 deg de course arriere en 11 pas de policy (0.112 s), et
      # la policy s'installait en butee -- son action moyenne y etait de -1.9,
      # contre -0.3 au maximum ailleurs.
      #
      # RWRR/LWRR tombent a 0.3054 pour une autre raison : q0 est passe a +-40
      # deg (alignement sur halfSitting de mc_hrp5_p), ce qui rapproche le joint
      # de sa butee et reduit sa course mini de 27 a 7 deg. C'est le joint le
      # plus serre de l'espace d'action desormais.
      WP:   0.5236
      WR:   1.875
      WY:   0.5208333333333334
      HY:   0.1716247162060515
      HP:   0.1716247162060515
      RSC:  0.3091190181094002
      RSP:  0.4363311220085059
      RSR:  0.3132832063085133
      RSY:  0.796178346367181
      REP:  0.22975301148104216
      RWRY: 1.081860805041801
      RWRR: 0.3054332480056704
      RWRP: 0.4595940326638579
      LSC:  0.3091190181094002
      LSP:  0.4363311220085059
      LSR:  0.3132832063085133
      LSY:  0.796178346367181
      LEP:  0.22975301148104216
      LWRY: 1.081860805041801
      LWRR: 0.3054332480056704
      LWRP: 0.4595940326638579
      # Hors ref_joint_order, jamais lu par currentActionScaled (boucle sur
      # actionToDofMap uniquement) -- 0 explicite par coherence.
      RHDY: 0.0
      LHDY: 0.0
      RTMP:  0.0
      RTPIP: 0.0
      RTDIP: 0.0
      RIMP:  0.0
      RIPIP: 0.0
      RIDIP: 0.0
      RMMP:  0.0
      RMPIP: 0.0
      RMDIP: 0.0
      LTMP:  0.0
      LTPIP: 0.0
      LTDIP: 0.0
      LIMP:  0.0
      LIPIP: 0.0
      LIDIP: 0.0
      LMMP:  0.0
      LMPIP: 0.0
      LMDIP: 0.0

    # HRP5P_PD_GAINS (mjlab hrp5_constants.py), reprises telles quelles de
    # hrp5p_mj_description/pdgains/PDgains_sim.dat -- gains PD REELS du robot,
    # PAS recopiees de RHPS1 (RHPS1 et HRP5P n'ont ni les memes joints ni les
    # memes actionneurs, cf. commentaire en tete du fichier).
    kp: &hrp5p_kp
      RCY:  5400.0
      RCR:  12925.0
      RCP:  16000.0
      RKP:  36000.0
      RAP:  8000.0
      RAR:  2244.0
      LCY:  5400.0
      LCR:  12925.0
      LCP:  16000.0
      LKP:  36000.0
      LAP:  8000.0
      LAR:  2244.0
      WP:   8000.0
      WR:   8000.0
      WY:   8000.0
      HY:   1311.0
      HP:   1311.0
      RSC:  3235.0
      RSP:  3235.0
      RSR:  5586.0
      RSY:  1429.0
      REP:  8705.0
      RWRY: 1386.0
      RWRR: 1386.0
      RWRP: 1492.0
      LSC:  3235.0
      LSP:  3235.0
      LSR:  5586.0
      LSY:  1429.0
      LEP:  8705.0
      LWRY: 1386.0
      LWRR: 1386.0
      LWRP: 1492.0
      # PDgains_sim.dat lignes 26-53 (hors ref_joint_order) : RHDY/LHDY et les
      # 9 articulations de chaque main partagent toutes la meme valeur (693.0).
      RHDY: 693.0
      LHDY: 693.0
      RTMP:  693.0
      RTPIP: 693.0
      RTDIP: 693.0
      RIMP:  693.0
      RIPIP: 693.0
      RIDIP: 693.0
      RMMP:  693.0
      RMPIP: 693.0
      RMDIP: 693.0
      LTMP:  693.0
      LTPIP: 693.0
      LTDIP: 693.0
      LIMP:  693.0
      LIPIP: 693.0
      LIDIP: 693.0
      LMMP:  693.0
      LMPIP: 693.0
      LMDIP: 693.0
    kd: &hrp5p_kd
      RCY:  54.00
      RCR:  103.40
      RCP:  160.00
      RKP:  360.00
      RAP:  80.00
      RAR:  22.44
      LCY:  54.00
      LCR:  103.40
      LCP:  160.00
      LKP:  360.00
      LAP:  80.00
      LAR:  22.44
      WP:   80.00
      WR:   80.00
      WY:   80.00
      HY:   13.11
      HP:   13.11
      RSC:  32.35
      RSP:  32.35
      RSR:  55.86
      RSY:  10.83
      REP:  87.05
      RWRY: 13.87
      RWRR: 13.87
      RWRP: 11.19
      LSC:  32.35
      LSP:  32.35
      LSR:  55.86
      LSY:  10.83
      LEP:  87.05
      LWRY: 13.87
      LWRR: 13.87
      LWRP: 11.19
      RHDY: 6.93
      LHDY: 6.93
      RTMP:  6.93
      RTPIP: 6.93
      RTDIP: 6.93
      RIMP:  6.93
      RIPIP: 6.93
      RIDIP: 6.93
      RMMP:  6.93
      RMPIP: 6.93
      RMDIP: 6.93
      LTMP:  6.93
      LTPIP: 6.93
      LTDIP: 6.93
      LIMP:  6.93
      LIPIP: 6.93
      LIDIP: 6.93
      LMMP:  6.93
      LMPIP: 6.93
      LMDIP: 6.93

    # HRP5P_INIT_STATE (mjlab hrp5_constants.py) = default_joint_pos de
    # policy/model_5000.onnx (metadata, arrondi a 3 decimales -- concorde, verifie
    # par tools/sync_policy_yaml.py). PAS recopie de RHPS1 : q0 definit
    # l'observation (jointPos_ = q_mesure - q_zero), une erreur ici est un biais
    # constant sur l'entree du reseau, pas juste un decalage de posture.
    #
    # RWRR/LWRR sont passes de +-20 a +-40 deg : HRP5P_INIT_STATE est desormais
    # aligne sur le halfSitting de mc_hrp5_p, qui etait le seul endroit ou les
    # deux differaient. Effet de bord : ces deux joints se retrouvent a 7 deg de
    # leur butee, d'ou leur action_scale rabotee plus haut.
    q0:
      RCY:  0.0
      RCR:  0.0
      RCP:  -0.468970    # -26.87 deg
      RKP:  0.872665     # 50 deg
      RAP:  -0.403695    # -23.13 deg
      RAR:  0.0
      LCY:  0.0
      LCR:  0.0
      LCP:  -0.468970
      LKP:  0.872665
      LAP:  -0.403695
      LAR:  0.0
      WP:   0.0
      WR:   0.0
      WY:   0.0
      HY:   0.0
      HP:   0.0
      RSC:  0.0
      RSP:  1.047198    # 60 deg
      RSR:  -0.349066   # -20 deg
      RSY:  -0.087266   # -5 deg
      REP:  -1.832596   # -105 deg
      RWRY: 0.0
      RWRR: -0.698132   # -40 deg
      RWRP: 0.0
      LSC:  0.0
      LSP:  1.047198
      LSR:  0.349066    # 20 deg
      LSY:  0.087266    # 5 deg
      LEP:  -1.832596
      LWRY: 0.0
      LWRR: 0.698132    # 40 deg
      LWRP: 0.0
      # halfSitting de mc_hrp5_p.cpp (pose de repos du module, PAS
      # l'entrainement -- ces joints n'en ont pas) : la PostureTask les y
      # tient en permanence puisqu'ils ne sont jamais ecrits par la RL.
      #
      # SEULEMENT RHDY/LHDY ici, PAS les 18 articulations des doigts (RTMP,
      # RIMP, ... ) : contrairement a kp/kd/effort_limit (.at() par nom,
      # tolerent aux cles en trop), configRL() exige
      # q0.keys().size() == nbActuatedJoints EXACTEMENT
      # (NewRLQPController.cpp:1481-1485). robot().refJointOrder() filtre a
      # 35 (confirme au chargement, log "35 actuated joints retained out of
      # 53") : les 18 doigts ont dof() != 1 ou !hasJoint() (mimic joints /
      # geres via les Grippers l_gripper=LTMP, r_gripper=RTMP dans
      # mc_hrp5_p.cpp) et ne comptent donc pas dans les 35. Les avoir dans
      # kp/kd/effort_limit/action_scale/vel_target_limit_per_joint ne pose
      # aucun probleme (ces maps ne verifient que la presence de chaque cle
      # utilisee, pas la taille totale) -- laisses tels quels par coherence
      # avec le reste du fichier.
      RHDY: 0.0
      LHDY: 0.0

    # Ordre ATTENDU PAR LE RESEAU, confirme directement dans les metadonnees
    # de policy/model_5000.onnx (joint_names, action_scale -- 33 entrees). NE PAS
    # utiliser l'ordre de HRP5P_ACTUATORS dans hrp5_constants.py : ce tuple
    # place LWRY avant LEP pour le bras gauche, incoherent avec l'onnx reel
    # (qui a EP avant WRY des deux cotes, symetrique avec le bras droit).
    ref_joint_order:
      - RCY
      - RCR
      - RCP
      - RKP
      - RAP
      - RAR
      - LCY
      - LCR
      - LCP
      - LKP
      - LAP
      - LAR
      - WP
      - WR
      - WY
      - HY
      - HP
      - RSC
      - RSP
      - RSR
      - RSY
      - REP
      - RWRY
      - RWRR
      - RWRP
      - LSC
      - LSP
      - LSR
      - LSY
      - LEP
      - LWRY
      - LWRR
      - LWRP

use_async_inference: false
log_timing: true
timing_log_interval: 100
# log_impact_vel: rising-edge detection on the ankle F/T sensors' Fz
# (RightFootForceSensor/LeftFootForceSensor -- same names on mc_hrp5_p,
# attached to Rleg_Link5/Lleg_Link5, confirmed in mc_hrp5_p.cpp). On
# touchdown, logs the ankle body's world-frame linear
# velocity (NewRLQPController_leftFootImpactVel / _rightFootImpactVel) --
# holds the last value between impacts, read it where
# NewRLQPController_{left,right}FootContact steps 0 -> 1. Raw Fz is logged
# unconditionally as NewRLQPController_{left,right}FootForceZ, needed to
# pick impact_force_threshold in the first place. This key existed in the
# yaml since the project's first commit but had no implementation behind it
# until 2026-08-20.
log_impact_vel: true
# impact_force_threshold: N on Fz, rising edge = touchdown.
impact_force_threshold: 30.0
# impact_force_hysteresis_ratio: falling-edge threshold = ratio * impact_force_threshold,
# so sensor noise straddling the threshold mid-stance does not retrigger the impact.
impact_force_hysteresis_ratio: 0.5
