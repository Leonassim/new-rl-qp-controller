---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# This block is the ONLY thing that actually puts a self-collision constraint
# in the solver: MCController.cpp:322-331 builds a CollisionsConstraint from
# the "collisions" key and calls solver().addConstraintSet() on it. The
# selfCollisionConstraint member tweaked in NewRLQPController's constructor
# (thigh iDist correction, setCollisionsDampers) is a SEPARATE object that is
# never added to the solver, so editing it there changes nothing -- and
# commenting this block out is what actually disables the protection.
#
# Briefly disabled on 2026-08-07 to test whether self-collision explained the
# QP-vs-bypass gap. It did not; restored.
collisions:
- type: collision
  useMinimal: true

# rhp7novel n'a PAS d'observateur MCWaiko, deliberement -- c'est tout le
# point de cette branche. obs_format: 0 (utils.cpp `case 0:`,
# NewRLQPController::initializeRLObservation()) lit base_ang_vel et
# projected_gravity directement sur le capteur brut "Accelerometer"
# (BodySensor::angularVelocity()/linearAcceleration()), peuple sans
# condition par l'interface (mc_mujoco ou le driver materiel), donc sans
# avoir besoin d'un observateur de pose du tout : RobotData (donc
# bodySensors) est partage entre robot()/realRobot(). Consequence directe :
# cette branche n'a plus besoin des forks ArnaudDmt de
# state-observation/mc_state_observation -- le superbuild d'origine du
# robot reel (upstream jrl-umi3218, sans WAIKO) suffit.
#
# checkFloatingBaseObserver() (NewRLQPController.cpp) court-circuite son
# exigence normale d'un observateur MCWaiko/BodySensor/KinematicInertial
# quand obsFormat_ == 0 -- ne pas s'etonner de son absence au demarrage.
ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Every policy is BUNDLED: the files live in policy/ and CMake installs the whole
# directory to @RL_POLICY_INSTALL_PREFIX@ (file(GLOB ... policy/*.onnx)). No
# absolute path to anyone's home, so a clone + build on the robot PC has the
# policies without needing the training repo checked out anywhere. Adding one
# is: drop the .onnx in policy/, add a line here and a matching policies[]
# block.
#
# For a local experiment you can still point an entry at a training log's ONNX,
# e.g. /home/<user>/<training-repo>/logs/rsl_rl/<run>/<run>.onnx -- but do not
# commit that, it breaks every other machine.
#
# policy/ ne contient QUE des .onnx RHP7 sur cette branche (heritee de
# `rhp7`, memes principes). novel.onnx n'a PAS tourne sur le robot RHP7 reel
# -- valide en simulation seulement pour l'instant. Armer depuis la GUI,
# garder une main sur l'arret d'urgence.
policy_path: [
  # Branche `rhp7novel` : forkee de `rhp7` le 2026-09-04 pour tester des
  # policies RHP7 Kaleido entrainees SANS base_lin_vel dans l'observation de
  # l'actor (garde critic-only a l'entrainement) et avec base_ang_vel/
  # projected_gravity lus directement sur le capteur IMU brut plutot que sur
  # un estimateur -- voir ObserverPipelines (MCWaiko retire) et utils.cpp
  # `case 0:`. Les policies obs_format: 6 heritees de `rhp7` (4.onnx,
  # rhp7flat.onnx, rhp7test2.onnx) ne fonctionnent plus sur cette branche
  # (checkFloatingBaseObserver() leve une erreur pour elles, faute de
  # MCWaiko) -- retirees d'ici, restent sur `rhp7` et dans l'historique git.
  #
  # index 0: novel.onnx. Six termes (base_ang_vel, projected_gravity,
  # joint_pos, joint_vel, actions, command) a l'historique 10 :
  # 10*(3+3+32+32+32+3) = 1050, verifie au chargement : "ONNX policy loaded
  # successfully (input: 1050, output: 32)".
  "@RL_POLICY_INSTALL_PREFIX@/novel.onnx",
]
default_policy_index: 0

# RHPS1 had a joint_torque_scale table here (N*Kt per joint, to work around
# RobotHardware publishing a raw current on `tau` instead of a torque on that
# robot's VRML). Removed on this RHP7 branch: this is a RHPS1-specific
# hardware quirk/Kt sourcing, not established for RHP7. The key is read via
# config_.has("joint_torque_scale") in NewRLQPController.cpp -- purely
# optional, only feeds the diagnostic NewRLQPController_joint_torque log
# entry, nothing in the QP or the RL inference depends on it. Without it,
# joint_torque simply stays at 0 for all joints (same as it already was for
# every joint not listed in RHPS1's table) and joint_current keeps logging
# normally.

policies:
  # index 0 : RHP7 Kaleido -- novel.onnx, velocity-action (JointVelocityAction
  # mjlab + integrale libre q_rl += action*dt), obs_format: 0 -> utils.cpp
  # `case 0:` (pas de base_lin_vel, base_ang_vel/projected_gravity depuis le
  # capteur IMU brut "Accelerometer", pas d'observateur de pose requis --
  # voir ObserverPipelines). Requiert MainRobot: RHP7.
  #
  # kp/kd/effort_limit/action_scale/vel_target_limit_per_joint ci-dessous
  # sont repris tels quels de l'index 0 de la branche `rhp7` (meme plant
  # physique RHP7_ACTUATOR_*, meme robot simule -- seule l'observation de
  # l'actor a change entre les deux runs). q0 confirme identique par
  # l'utilisateur (2026-09-04) : meme pose bras bas que le run precedent.
  #
  # ATTENTION : le depot mjlab local (/home/leroyhi/mjlab, rhp7_constants.py)
  # contient une AUTRE config d'actionneurs (raideur uniforme 157.91, efforts
  # asymetriques gauche/droite sur le bras) -- celle-ci n'est PAS celle qui a
  # entraine ce run. Ne pas s'y referer pour RHP7.
  - use_QP: true
    obs_format: 0
    velocity_action: true
    use_torque_task: false
    qp_accel_task: false
    joint_armature: 1.0
    # 10 ms confirme par l'auteur du run. NE PAS le rederiver depuis la
    # decimation du depot mjlab local : celui-ci laisse la valeur de base 8
    # (8*0.0025 = 0.02), alors que le run 2026-08-23_21-06-44 a bien tourne a
    # 0.01, comme RHPS1 (decimation 4).
    policy_step_size: 0.01   # 100 Hz (10 ms)
    physics_step_size: 0.0025  # mc_mujoco a 400 Hz (2.5 ms)
    pd_gains_ratio: 1.0
    # DECOUVERT MANQUANT le 2026-09-04 en debuggant une chute a t=38s (voir
    # log du run) : sans cette cle, postureStiffness() retombe sur
    # 0.2/(policy_step_size*timeStep) = 0.2/(0.01*0.005) = 4000, un lag de
    # 1/sqrt(4000) = 15.8 ms au lieu des 25 ms attendus. La policy a ete
    # entrainee avec le filtre FiniteDifferencePdActuator a
    # posture_task_stiffness = 1600 (confirme par l'auteur) -- meme lag
    # requis en simulation (1/sqrt(K), independant de dt, voir le commentaire
    # de NewRLQPController::postureStiffness()). Sans ce K explicite, la QP
    # repond plus raide/plus vite que ce que le reseau a appris a compenser :
    # invisible pas a pas, mais un biais systematique qui semble s'accumuler
    # sur ~20-30s avant de devenir destabilisant.
    posture_stiffness: 1600
    # Le curriculum d'entrainement va jusqu'a +/-1.0 sur vx et sur le yaw
    # (env_cfgs.py: lin_vel_x et ang_vel_z = (-1.0, 1.0)). Volontairement bride
    # ici pour les premiers runs -- a relever une fois le comportement valide.
    max_vel_x: 0.3
    max_vel_y: 0.2
    max_yaw: 0.45
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5

    # NE PAS mettre a 0 : effort_limit et vel_target_limit_per_joint ne sont
    # charges que sous `if(torqueFeasibilityRatio_ > 0.0)`
    # (NewRLQPController.cpp:379-392). Sur le chemin velocity_action la
    # projection elle-meme ne s'applique pas, mais les deux clamps qu'ils
    # alimentent -- anti-windup et plafond de qdTarget -- si. A 0, ils
    # disparaissent en silence (maxTargetDev_ = 0, velTargetLimitPerJoint_ = 1e9).
    torque_feasibility_ratio: 1.0
    vel_target_filter_alpha: 0.8

    # effort_limit reels des RHP7_ACTUATOR_* d'entrainement (fournis par
    # l'auteur du run). Remplace un premier jet copie de RHPS1 -- PAS de
    # RHPS1_reel en commentaire ici, ce sont deja les valeurs reelles RHP7.
    # Symetrique gauche/droite partout (contrairement au rhp7_constants.py du
    # depot mjlab local, qui a R_ELBOW_* a 35 quand L_ELBOW_* est a 25 : cette
    # asymetrie ne vient pas du run qui a produit l'ONNX charge ici).
    effort_limit: &rhp7_effort_limit
      CHEST_Y:        70
      CHEST_P:        70
      HEAD_Y:         5
      HEAD_P:         5
      L_SHOULDER_P:   35
      L_SHOULDER_R:   35
      L_SHOULDER_Y:   35
      L_ELBOW_P:      25
      L_ELBOW_Y:      25
      L_WRIST_P:      15
      L_WRIST_Y:      15
      L_HAND:         3
      R_SHOULDER_P:   35
      R_SHOULDER_R:   35
      R_SHOULDER_Y:   35
      R_ELBOW_P:      25
      R_ELBOW_Y:      25
      R_WRIST_P:      15
      R_WRIST_Y:      15
      R_HAND:         3
      L_CROTCH_Y:     40
      L_CROTCH_R:     125
      L_CROTCH_P:     125
      L_KNEE_P:       175
      L_ANKLE_R:      100
      L_ANKLE_P:      100
      R_CROTCH_Y:     40
      R_CROTCH_R:     125
      R_CROTCH_P:     125
      R_KNEE_P:       175
      R_ANKLE_R:      100
      R_ANKLE_P:      100

    vel_target_limit_per_joint: &rhp7_vel_target_limit_per_joint
      CHEST_Y:        6
      CHEST_P:        6
      HEAD_Y:         4
      HEAD_P:         4
      L_SHOULDER_P:   6
      L_SHOULDER_R:   6
      L_SHOULDER_Y:   6
      L_ELBOW_P:      6
      L_ELBOW_Y:      6
      L_WRIST_P:      6
      L_WRIST_Y:      6
      L_HAND:         6
      R_SHOULDER_P:   6
      R_SHOULDER_R:   6
      R_SHOULDER_Y:   6
      R_ELBOW_P:      6
      R_ELBOW_Y:      6
      R_WRIST_P:      6
      R_WRIST_Y:      6
      R_HAND:         6
      L_CROTCH_Y:     8
      L_CROTCH_R:     8
      L_CROTCH_P:     8
      L_KNEE_P:       10
      L_ANKLE_R:      10
      L_ANKLE_P:      10
      R_CROTCH_Y:     8
      R_CROTCH_R:     8
      R_CROTCH_P:     8
      R_KNEE_P:       10
      R_ANKLE_R:      10
      R_ANKLE_P:      10

    # RHP7_ACTION_SCALE du run d'entrainement, en precision pleine (fourni par
    # l'auteur). Recoupe avec les metadonnees `action_scale` de l'ONNX (run
    # 2026-08-23_21-06-44), qui les arrondissent a 3 decimales : les 32 entrees
    # concordent.
    #
    # NE PAS rederiver depuis rhp7_constants.py : la formule 0.5*effort/STIFFNESS
    # du depot mjlab local donnerait 0.633 au genou contre 0.292 ici. Le run a
    # tourne avec une autre config d'actionneurs.
    #
    # L_HAND / R_HAND ramenes a 0.05 le 2026-09-06 (etaient a 0.2, et le
    # commentaire precedent parlait meme de 27.27 a un moment anterieur) :
    # meme ordre de grandeur que les autres joints du bras plutot qu'une
    # echelle a part. Les mains restent volontairement molles par ailleurs
    # (kp 1 / kd 0.1), sans recompense dessus a l'entrainement.
    action_scale: &rhp7_action_scale
      CHEST_Y:      0.07954545454545454
      CHEST_P:      0.07954545454545454
      HEAD_Y:       0.07142857142857142
      HEAD_P:       0.07142857142857142
      L_SHOULDER_P: 0.08974358974358974
      L_SHOULDER_R: 0.09210526315789473
      L_SHOULDER_Y: 0.09210526315789473
      L_ELBOW_P:    0.06578947368421052
      L_ELBOW_Y:    0.06578947368421052
      L_WRIST_P:    0.039473684210526314
      L_WRIST_Y:    0.039473684210526314
      L_HAND:       0.05
      R_SHOULDER_P: 0.08974358974358974
      R_SHOULDER_R: 0.09210526315789473
      R_SHOULDER_Y: 0.09210526315789473
      R_ELBOW_P:    0.06578947368421052
      R_ELBOW_Y:    0.06578947368421052
      R_WRIST_P:    0.039473684210526314
      R_WRIST_Y:    0.039473684210526314
      R_HAND:       0.05
      L_CROTCH_Y:   0.06666666666666667
      L_CROTCH_R:   0.20833333333333334
      L_CROTCH_P:   0.20833333333333334
      L_KNEE_P:     0.2916666666666667
      L_ANKLE_R:    0.25
      L_ANKLE_P:    0.25
      R_CROTCH_Y:   0.06666666666666667
      R_CROTCH_R:   0.20833333333333334
      R_CROTCH_P:   0.20833333333333334
      R_KNEE_P:     0.2916666666666667
      R_ANKLE_R:    0.25
      R_ANKLE_P:    0.25

    # Confirmes reels par l'auteur du run (cf. en-tete du bloc) -- coincident
    # avec les valeurs RHPS1 par lesquelles ce fichier est passe en premier
    # jet. Mains a kp 1 / kd 0.1 : volontairement molles, la politique les
    # bouge a peine et elles ne portent aucune charge.
    kp: &rhp7_kp
      L_CROTCH_Y:   20000.0
      L_CROTCH_R:   20000.0
      L_CROTCH_P:   20000.0
      L_KNEE_P:     20000.0
      L_ANKLE_R:    10000.0
      L_ANKLE_P:    10000.0
      CHEST_Y:      44000.0
      CHEST_P:      44000.0
      R_CROTCH_Y:   20000.0
      R_CROTCH_R:   20000.0
      R_CROTCH_P:   20000.0
      R_KNEE_P:     20000.0
      R_ANKLE_R:    10000.0
      R_ANKLE_P:    10000.0
      HEAD_Y:       2000.0
      HEAD_P:       2000.0
      L_SHOULDER_P: 15000.0
      L_SHOULDER_R: 14000.0
      L_SHOULDER_Y: 14000.0
      L_ELBOW_P:    14000.0
      L_ELBOW_Y:    14000.0
      L_WRIST_P:    14000.0   # valeur RHPS1 de L_WRIST_R
      L_WRIST_Y:    14000.0
      L_HAND:       1.0
      R_SHOULDER_P: 15000.0
      R_SHOULDER_R: 14000.0
      R_SHOULDER_Y: 14000.0
      R_ELBOW_P:    14000.0
      R_ELBOW_Y:    14000.0
      R_WRIST_P:    14000.0   # valeur RHPS1 de R_WRIST_R
      R_WRIST_Y:    14000.0
      R_HAND:       1.0
    kd: &rhp7_kd
      L_CROTCH_Y:   400.0
      L_CROTCH_R:   400.0
      L_CROTCH_P:   400.0
      L_KNEE_P:     400.0
      L_ANKLE_R:    300.0
      L_ANKLE_P:    300.0
      CHEST_Y:      440.0
      CHEST_P:      440.0
      R_CROTCH_Y:   400.0
      R_CROTCH_R:   400.0
      R_CROTCH_P:   400.0
      R_KNEE_P:     400.0
      R_ANKLE_R:    300.0
      R_ANKLE_P:    300.0
      HEAD_Y:       50.0
      HEAD_P:       50.0
      L_SHOULDER_P: 240.0
      L_SHOULDER_R: 240.0
      L_SHOULDER_Y: 240.0
      L_ELBOW_P:    240.0
      L_ELBOW_Y:    240.0
      L_WRIST_P:    240.0     # valeur RHPS1 de L_WRIST_R
      L_WRIST_Y:    240.0
      L_HAND:       0.1
      R_SHOULDER_P: 240.0
      R_SHOULDER_R: 240.0
      R_SHOULDER_Y: 240.0
      R_ELBOW_P:    240.0
      R_ELBOW_Y:    240.0
      R_WRIST_P:    240.0     # valeur RHPS1 de R_WRIST_R
      R_WRIST_Y:    240.0
      R_HAND:       0.1

    # KNEES_BENT_KEYFRAME du run d'entrainement (fourni par l'auteur), en
    # precision pleine. Recoupe valeur par valeur avec les metadonnees
    # `default_joint_pos` de l'ONNX (run 2026-08-23_21-06-44), qui les arrondit
    # a 3 decimales -- les 12 entrees non nulles concordent.
    #
    # VOLONTAIREMENT PAS recopie de RHPS1, contrairement a kp/kd/effort_limit :
    # q0 n'est pas un reglage, il DEFINIT L'OBSERVATION. utils.cpp case 2
    # alimente le reseau avec
    #   jointPosDeep_[0](j) = q_mesure - q_zero(j)
    # c'est-a-dire le joint_pos_rel de mjlab. Une erreur sur q0 est un biais
    # constant sur l'entree du reseau, pas un simple decalage de posture.
    # L'ecart aux valeurs RHPS1 etait majeur : ELBOW_P -80 deg contre -30 deg,
    # soit 0.87 rad de biais permanent.
    #
    # A noter : cette pose met CROTCH_R et ANKLE_R exactement a 0, la ou RHPS1
    # les ouvre a +/-0.029 / -+0.031.
    q0:
      CHEST_Y:      0.0         # 0 deg
      CHEST_P:      0.0         # 0 deg
      HEAD_Y:       0.0         # absent du keyframe -> defaut 0, confirme par l'ONNX
      HEAD_P:       0.0         # idem
      L_SHOULDER_P: 0.261799    # 15 deg
      L_SHOULDER_R: 0.087266    # 5 deg
      L_SHOULDER_Y: -0.087266   # -5 deg
      L_ELBOW_P:    -0.523599   # -30 deg
      L_ELBOW_Y:    0.0
      L_WRIST_P:    0.0
      L_WRIST_Y:    0.0
      L_HAND:       0.0
      R_SHOULDER_P: 0.261799    # 15 deg
      R_SHOULDER_R: -0.087266   # -5 deg
      R_SHOULDER_Y: 0.087266    # 5 deg
      R_ELBOW_P:    -0.523599   # -30 deg
      R_ELBOW_Y:    0.0
      R_WRIST_P:    0.0
      R_WRIST_Y:    0.0
      R_HAND:       0.0
      L_CROTCH_Y:   0.0         # 0 deg
      L_CROTCH_R:   0.0         # 0 deg
      L_CROTCH_P:   -0.296706   # -17 deg
      L_KNEE_P:     0.628319    # 36 deg
      L_ANKLE_R:    0.0         # 0 deg
      L_ANKLE_P:    -0.331613   # -19 deg
      R_CROTCH_Y:   0.0
      R_CROTCH_R:   0.0
      R_CROTCH_P:   -0.296706   # -17 deg
      R_KNEE_P:     0.628319    # 36 deg
      R_ANKLE_R:    0.0
      R_ANKLE_P:    -0.331613   # -19 deg

    # Ordre des joints ATTENDU PAR LE RESEAU (pas celui du robot). Repris de
    # l'ordre des actionneurs de RHP7_ARTICULATION (rhp7_constants.py), qui suit
    # le meme motif que l'ONNX RHPS1 verifie : chest, head, bras G, bras D,
    # jambe G, jambe D. A confirmer contre `joint_names` de l'ONNX -- une
    # permutation ici est silencieuse et enverrait chaque commande au mauvais
    # joint.
    ref_joint_order: &rhp7_ref_joint_order
      - CHEST_Y
      - CHEST_P
      - HEAD_Y
      - HEAD_P
      - L_SHOULDER_P
      - L_SHOULDER_R
      - L_SHOULDER_Y
      - L_ELBOW_P
      - L_ELBOW_Y
      - L_WRIST_P
      - L_WRIST_Y
      - L_HAND
      - R_SHOULDER_P
      - R_SHOULDER_R
      - R_SHOULDER_Y
      - R_ELBOW_P
      - R_ELBOW_Y
      - R_WRIST_P
      - R_WRIST_Y
      - R_HAND
      - L_CROTCH_Y
      - L_CROTCH_R
      - L_CROTCH_P
      - L_KNEE_P
      - L_ANKLE_R
      - L_ANKLE_P
      - R_CROTCH_Y
      - R_CROTCH_R
      - R_CROTCH_P
      - R_KNEE_P
      - R_ANKLE_R
      - R_ANKLE_P
use_async_inference: false
log_timing: true
timing_log_interval: 100
# log_impact_vel: rising-edge detection on the ankle F/T sensors' Fz
# (RightFootForceSensor/LeftFootForceSensor, RHPS1main.xml's rf_force/
# lf_force sites). On touchdown, logs the ankle body's world-frame linear
# velocity (NewRLQPController_leftFootImpactVel / _rightFootImpactVel) --
# holds the last value between impacts, read it where
# NewRLQPController_{left,right}FootContact steps 0 -> 1. Raw Fz is logged
# unconditionally as NewRLQPController_{left,right}FootForceZ, needed to
# pick impact_force_threshold in the first place. This key existed in the
# yaml since the project's first commit but had no implementation behind it
# until 2026-08-20.
log_impact_vel: true
# impact_force_threshold: N on Fz, rising edge = touchdown.
impact_force_threshold: 30.0
# impact_force_hysteresis_ratio: falling-edge threshold = ratio * impact_force_threshold,
# so sensor noise straddling the threshold mid-stance does not retrigger the impact.
impact_force_hysteresis_ratio: 0.5
