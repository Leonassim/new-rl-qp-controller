      L_CROTCH_P:       8.0
      L_KNEE_P:         8.0
      L_ANKLE_R:        8.0
      L_ANKLE_P:        8.0
      R_CROTCH_Y:       8.0
      R_CROTCH_R:       8.0
      R_CROTCH_P:       8.0
      R_KNEE_P:         8.0
      R_ANKLE_R:        8.0
