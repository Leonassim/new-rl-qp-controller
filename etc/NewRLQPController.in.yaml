---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# This block is the ONLY thing that actually puts a self-collision constraint
# in the solver: MCController.cpp:322-331 builds a CollisionsConstraint from
# the "collisions" key and calls solver().addConstraintSet() on it. The
# selfCollisionConstraint member tweaked in NewRLQPController's constructor
# (thigh iDist correction, setCollisionsDampers) is a SEPARATE object that is
# never added to the solver, so editing it there changes nothing -- and
# commenting this block out is what actually disables the protection.
#
# Briefly disabled on 2026-08-07 to test whether self-collision explained the
# QP-vs-bypass gap. It did not; restored.
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences
    # WAIKO estimator: IMU + legged odometry (no QP contacts needed).
    # imuSensor must be the real IMU (Accelerometer, gyro+accelero at the imu
    # site) -- FloatingBase is the mc_mujoco ground-truth pose sensor.
    # filterGains/leggedOdometry come from the installed default MCWaiko.yaml.
    - type: MCWaiko
      update: true
      gui: true
      imuSensor: Accelerometer
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # Ground-truth fallback (mc_mujoco perfect pose), for comparison:
    - type: BodySensor
      update: false
      gui: true
      bodySensor: FloatingBase

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Every policy is BUNDLED: the files live in policy/ and CMake installs the whole
# directory to @RL_POLICY_INSTALL_PREFIX@. No absolute path to anyone's home, so
# a clone + build on the robot PC has the policies without needing mjlab-rhps1
# checked out anywhere. Adding one is: drop the .onnx in policy/, add a line here
# and a matching policies[] block.
#
# For a local experiment you can still point an entry at a training log's ONNX,
# e.g. /home/<user>/mjlab-rhps1/logs/rsl_rl/rhps1_velocity/<run>/<run>.onnx --
# but do not commit that, it breaks every other machine.
#
# ONLY INDEX 0 HAS EVER RUN ON HARDWARE (2026-08-06). Index 1 is
# simulation-validated at best; it uses an observation channel whose C++
# implementation has never been exercised on the robot. Arm from the GUI, keep a
# hand on the stop.
#
# Indices 2-4 (abl7/V4, abl15/V5, the wide-randomization posture-filter run)
# were removed 2026-08-17 -- none beat index 1, and the wide-randomization one
# had regressed on its own metrics. Full record in git history, commit 5d0fcf5
# and earlier.
policy_path: [
  # Branche `rhp7` : ce fichier ne porte QUE les policies RHP7 Kaleido. Les
  # entrees RHPS1 vivent sur `real-robot-safe` et ont ete retirees ici le
  # 2026-09-01 -- les deux robots ne peuvent de toute facon pas coexister a
  # l'execution (MainRobot est fige au demarrage de mc_rtc, et les maps
  # kp/kd/q0 sont lues en .at() contre le refJointOrder du robot charge, donc
  # un index de l'autre robot leve std::out_of_range dans initializeRobot()).
  # Exige MainRobot: RHP7 dans mc_rtc.yaml (module rhp7.so, branche `mujoco`
  # de Yoshida-Lab-TUS/mc_rhp7, dont le _ref_joint_order laisse tomber les 14
  # joints lineaires en boucle fermee : 38 dof = 32 + base flottante).
  #
  # index 0: RHP7 Kaleido, velocity-action. 32 joints actionnes au lieu des 30
  # de RHPS1 (_WRIST_P la ou RHPS1 a _WRIST_R, plus L_HAND/R_HAND actionnes).
  #
  # obs_format: 6 sur les blocs ci-dessous route vers le `case 6:` de
  # utils.cpp (sept termes, parametre sur refJointOrderRLAction.size()).
  # La longueur d'historique effective est V3_DEEP_HISTORY_SIZE = 10
  # (NewRLQPController.h), pas 40 : 10*(3+3+3+32+32+32+3) = 1080, ce qui est
  # bien la forme d'entree des trois ONNX ci-dessous (verifie au chargement :
  # "ONNX policy loaded successfully (input: 1080, output: 32)"). Le
  # commentaire de `case 6:` dans utils.cpp annonce encore 40 -> 4320 ; c'est
  # le commentaire qui est faux, pas le code.
  #
  # C'est aussi pourquoi rhp7_velocity.onnx n'est plus reference ici : il
  # declare une entree de 4320 et ferait lever "Observation size mismatch" a
  # la premiere inference. Il reste dans policy/ pour l'historique.
  #
  # Le numero est garde tel quel plutot que remis a 0 pour rester lisible face
  # a l'historique et aux commentaires de la branche RHPS1 : index et
  # obs_format/case C++ sont independants de toute facon.
  "@RL_POLICY_INSTALL_PREFIX@/night2.onnx",
  # index 1, 2: rhp7flat / rhp7test2 -- meme reseau/plant que l'index 0, seul
  # q0 change (le _stance du module robot au lieu du q0 d'entrainement). Voir
  # le commentaire sur leurs blocs dans policies: plus bas.
  "@RL_POLICY_INSTALL_PREFIX@/rhp7flat.onnx",
  "@RL_POLICY_INSTALL_PREFIX@/rhp7test2.onnx",
]
# 0 = night2. Les trois .onnx sont desormais bundles dans policy/ et installes
# par le glob de CMakeLists.txt, donc un clone + build sur le PC du robot les
# a tous les trois -- les index 1 et 2 sont selectionnables depuis la GUI.
#
# Exige MainRobot: RHP7 dans mc_rtc.yaml. Un index incoherent avec le robot
# charge leve std::out_of_range dans initializeRobot() (les maps kp/kd/q0 sont
# lues avec .at() sur le refJointOrder du robot courant).
default_policy_index: 0

# RHPS1 had a joint_torque_scale table here (N*Kt per joint, to work around
# RobotHardware publishing a raw current on `tau` instead of a torque on that
# robot's VRML). Removed on this RHP7 branch: this is a RHPS1-specific
# hardware quirk/Kt sourcing, not established for RHP7. The key is read via
# config_.has("joint_torque_scale") in NewRLQPController.cpp -- purely
# optional, only feeds the diagnostic NewRLQPController_joint_torque log
# entry, nothing in the QP or the RL inference depends on it. Without it,
# joint_torque simply stays at 0 for all joints (same as it already was for
# every joint not listed in RHPS1's table) and joint_current keeps logging
# normally.

policies:
  # index 0 : RHP7 Kaleido -- velocity-action (JointVelocityAction mjlab +
  # integrale libre q_rl += action*dt, utils.cpp `case 6:`). Requiert
  # MainRobot: RHP7. Route explicitement vers `case 6:` via obs_format: 6
  # ci-dessous, PAS via son propre numero d'index -- le numero de case a ete
  # garde a 6 en passant de real-robot-safe a cette branche, pour que les
  # commentaires et l'historique des deux branches restent lisibles ensemble.
  # Index et obs_format/case C++ sont independants. Historique du
  # numero de case : index 5 directement (numero d'index = case du switch, sans
  # cle obs_format) -> index 6 de real-robot-safe avec obs_format: 5 (2026-08-27,
  # quand le collegue a repris les index 3/4/5 pour trois nouvelles policies
  # RHPS1) -> obs_format: 6 (2026-08-31, quand le collegue a reclame case 5 pour
  # son propre nouveau format RHPS1 510 dims/hist5) -> index 0 de cette branche
  # (2026-09-01, separation des deux robots par branche), case inchangee.
  # 32 joints actionnes contre 30 pour RHPS1 :
  #   - L_WRIST_P / R_WRIST_P la ou RHPS1 a L_WRIST_R / R_WRIST_R
  #   - L_HAND / R_HAND sont actionnes (RHPS1 les filtre)
  # Verifie a l'execution : le smoke test du module annonce "RHP7 has 38 dof"
  # = 32 + 6 (base flottante).
  #
  # kp/kd ci-dessous ont d'abord ete recopies de RHPS1 en attendant un reglage
  # RHP7 propre -- puis confirmes CORRECTS par l'auteur du run : ce sont
  # exactement les stiffness/damping des IdealPdActuatorCfg d'entrainement
  # (RHP7_ACTUATOR_*), qui se trouvent coincider avec ceux de RHPS1. Le
  # commentaire "recopie de RHPS1" reste sur le bloc kp/kd plus bas pour
  # tracer l'origine, mais ce ne sont plus des valeurs provisoires.
  #
  # ATTENTION : le depot mjlab local (/home/leroyhi/mjlab, rhp7_constants.py)
  # contient une AUTRE config d'actionneurs (raideur uniforme 157.91, efforts
  # asymetriques gauche/droite sur le bras) -- celle-ci n'est PAS celle qui a
  # entraine ce run. Ne pas s'y referer pour RHP7.
  #
  # effort_limit provient des RHP7_ACTUATOR_* reels (fournis par l'auteur, cf.
  # le bloc plus bas) -- donc maxTargetDev_ = effort_limit/kp (l'anti-windup de
  # utils.cpp) et rawTorqueRatio (= |tau|/effort_limit) sont maintenant tous
  # les deux calcules contre le plant reel d'entrainement.
  #
  # action_scale = RHP7_ACTION_SCALE du run (fourni par l'auteur, PAS derive
  # de la formule 0.5*effort/stiffness du depot mjlab local -- elle ne
  # reproduit pas ces valeurs, cf. commentaire sur le bloc action_scale).
  - use_QP: true
    obs_format: 6
    velocity_action: true
    use_torque_task: false
    qp_accel_task: false
    joint_armature: 1.0
    # 10 ms confirme par l'auteur du run. NE PAS le rederiver depuis la
    # decimation du depot mjlab local : celui-ci laisse la valeur de base 8
    # (8*0.0025 = 0.02), alors que le run 2026-08-23_21-06-44 a bien tourne a
    # 0.01, comme RHPS1 (decimation 4).
    policy_step_size: 0.01   # 100 Hz (10 ms)
    physics_step_size: 0.0025  # mc_mujoco a 400 Hz (2.5 ms)
    pd_gains_ratio: 1.0
    # Le curriculum d'entrainement va jusqu'a +/-1.0 sur vx et sur le yaw
    # (env_cfgs.py: lin_vel_x et ang_vel_z = (-1.0, 1.0)). Volontairement bride
    # ici pour les premiers runs -- a relever une fois le comportement valide.
    max_vel_x: 0.3
    max_vel_y: 0.2
    max_yaw: 0.45
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5

    # NE PAS mettre a 0 : effort_limit et vel_target_limit_per_joint ne sont
    # charges que sous `if(torqueFeasibilityRatio_ > 0.0)`
    # (NewRLQPController.cpp:379-392). Sur le chemin velocity_action la
    # projection elle-meme ne s'applique pas, mais les deux clamps qu'ils
    # alimentent -- anti-windup et plafond de qdTarget -- si. A 0, ils
    # disparaissent en silence (maxTargetDev_ = 0, velTargetLimitPerJoint_ = 1e9).
    torque_feasibility_ratio: 1.0
    vel_target_filter_alpha: 0.8

    # effort_limit reels des RHP7_ACTUATOR_* d'entrainement (fournis par
    # l'auteur du run). Remplace un premier jet copie de RHPS1 -- PAS de
    # RHPS1_reel en commentaire ici, ce sont deja les valeurs reelles RHP7.
    # Symetrique gauche/droite partout (contrairement au rhp7_constants.py du
    # depot mjlab local, qui a R_ELBOW_* a 35 quand L_ELBOW_* est a 25 : cette
    # asymetrie ne vient pas du run qui a produit l'ONNX charge ici).
    effort_limit: &rhp7_effort_limit
      CHEST_Y:        70
      CHEST_P:        70
      HEAD_Y:         5
      HEAD_P:         5
      L_SHOULDER_P:   35
      L_SHOULDER_R:   35
      L_SHOULDER_Y:   35
      L_ELBOW_P:      25
      L_ELBOW_Y:      25
      L_WRIST_P:      15
      L_WRIST_Y:      15
      L_HAND:         3
      R_SHOULDER_P:   35
      R_SHOULDER_R:   35
      R_SHOULDER_Y:   35
      R_ELBOW_P:      25
      R_ELBOW_Y:      25
      R_WRIST_P:      15
      R_WRIST_Y:      15
      R_HAND:         3
      L_CROTCH_Y:     40
      L_CROTCH_R:     125
      L_CROTCH_P:     125
      L_KNEE_P:       175
      L_ANKLE_R:      100
      L_ANKLE_P:      100
      R_CROTCH_Y:     40
      R_CROTCH_R:     125
      R_CROTCH_P:     125
      R_KNEE_P:       175
      R_ANKLE_R:      100
      R_ANKLE_P:      100

    vel_target_limit_per_joint: &rhp7_vel_target_limit_per_joint
      CHEST_Y:        6
      CHEST_P:        6
      HEAD_Y:         4
      HEAD_P:         4
      L_SHOULDER_P:   6
      L_SHOULDER_R:   6
      L_SHOULDER_Y:   6
      L_ELBOW_P:      6
      L_ELBOW_Y:      6
      L_WRIST_P:      6
      L_WRIST_Y:      6
      L_HAND:         6
      R_SHOULDER_P:   6
      R_SHOULDER_R:   6
      R_SHOULDER_Y:   6
      R_ELBOW_P:      6
      R_ELBOW_Y:      6
      R_WRIST_P:      6
      R_WRIST_Y:      6
      R_HAND:         6
      L_CROTCH_Y:     8
      L_CROTCH_R:     8
      L_CROTCH_P:     8
      L_KNEE_P:       10
      L_ANKLE_R:      10
      L_ANKLE_P:      10
      R_CROTCH_Y:     8
      R_CROTCH_R:     8
      R_CROTCH_P:     8
      R_KNEE_P:       10
      R_ANKLE_R:      10
      R_ANKLE_P:      10

    # RHP7_ACTION_SCALE du run d'entrainement, en precision pleine (fourni par
    # l'auteur). Recoupe avec les metadonnees `action_scale` de l'ONNX (run
    # 2026-08-23_21-06-44), qui les arrondissent a 3 decimales : les 32 entrees
    # concordent.
    #
    # NE PAS rederiver depuis rhp7_constants.py : la formule 0.5*effort/STIFFNESS
    # du depot mjlab local donnerait 0.633 au genou contre 0.292 ici. Le run a
    # tourne avec une autre config d'actionneurs.
    #
    # L_HAND / R_HAND a 27.27 n'est pas une faute de frappe : c'est ~300x
    # l'echelle des autres joints. En velocity_action q_rl += action*scale*dt,
    # donc une action unitaire demande 0.27 rad par pas sur la main. utils.cpp
    # clampe ensuite sur les butees du joint, et les mains sont volontairement
    # molles ici (kp 1 / kd 0.1), donc c'est contenu -- mais attends-toi a les
    # voir coller a leur limite. Signe que la main etait quasi libre pendant
    # l'entrainement (aucune recompense dessus).
    action_scale: &rhp7_action_scale
      CHEST_Y:      0.07954545454545454
      CHEST_P:      0.07954545454545454
      HEAD_Y:       0.07142857142857142
      HEAD_P:       0.07142857142857142
      L_SHOULDER_P: 0.08974358974358974
      L_SHOULDER_R: 0.09210526315789473
      L_SHOULDER_Y: 0.09210526315789473
      L_ELBOW_P:    0.06578947368421052
      L_ELBOW_Y:    0.06578947368421052
      L_WRIST_P:    0.039473684210526314
      L_WRIST_Y:    0.039473684210526314
      L_HAND:       0.2
      R_SHOULDER_P: 0.08974358974358974
      R_SHOULDER_R: 0.09210526315789473
      R_SHOULDER_Y: 0.09210526315789473
      R_ELBOW_P:    0.06578947368421052
      R_ELBOW_Y:    0.06578947368421052
      R_WRIST_P:    0.039473684210526314
      R_WRIST_Y:    0.039473684210526314
      R_HAND:       0.2
      L_CROTCH_Y:   0.06666666666666667
      L_CROTCH_R:   0.20833333333333334
      L_CROTCH_P:   0.20833333333333334
      L_KNEE_P:     0.2916666666666667
      L_ANKLE_R:    0.25
      L_ANKLE_P:    0.25
      R_CROTCH_Y:   0.06666666666666667
      R_CROTCH_R:   0.20833333333333334
      R_CROTCH_P:   0.20833333333333334
      R_KNEE_P:     0.2916666666666667
      R_ANKLE_R:    0.25
      R_ANKLE_P:    0.25

    # Confirmes reels par l'auteur du run (cf. en-tete du bloc) -- coincident
    # avec les valeurs RHPS1 par lesquelles ce fichier est passe en premier
    # jet. Mains a kp 1 / kd 0.1 : volontairement molles, la politique les
    # bouge a peine et elles ne portent aucune charge.
    kp: &rhp7_kp
      L_CROTCH_Y:   20000.0
      L_CROTCH_R:   20000.0
      L_CROTCH_P:   20000.0
      L_KNEE_P:     20000.0
      L_ANKLE_R:    10000.0
      L_ANKLE_P:    10000.0
      CHEST_Y:      44000.0
      CHEST_P:      44000.0
      R_CROTCH_Y:   20000.0
      R_CROTCH_R:   20000.0
      R_CROTCH_P:   20000.0
      R_KNEE_P:     20000.0
      R_ANKLE_R:    10000.0
      R_ANKLE_P:    10000.0
      HEAD_Y:       2000.0
      HEAD_P:       2000.0
      L_SHOULDER_P: 15000.0
      L_SHOULDER_R: 14000.0
      L_SHOULDER_Y: 14000.0
      L_ELBOW_P:    14000.0
      L_ELBOW_Y:    14000.0
      L_WRIST_P:    14000.0   # valeur RHPS1 de L_WRIST_R
      L_WRIST_Y:    14000.0
      L_HAND:       1.0
      R_SHOULDER_P: 15000.0
      R_SHOULDER_R: 14000.0
      R_SHOULDER_Y: 14000.0
      R_ELBOW_P:    14000.0
      R_ELBOW_Y:    14000.0
      R_WRIST_P:    14000.0   # valeur RHPS1 de R_WRIST_R
      R_WRIST_Y:    14000.0
      R_HAND:       1.0
    kd: &rhp7_kd
      L_CROTCH_Y:   400.0
      L_CROTCH_R:   400.0
      L_CROTCH_P:   400.0
      L_KNEE_P:     400.0
      L_ANKLE_R:    300.0
      L_ANKLE_P:    300.0
      CHEST_Y:      440.0
      CHEST_P:      440.0
      R_CROTCH_Y:   400.0
      R_CROTCH_R:   400.0
      R_CROTCH_P:   400.0
      R_KNEE_P:     400.0
      R_ANKLE_R:    300.0
      R_ANKLE_P:    300.0
      HEAD_Y:       50.0
      HEAD_P:       50.0
      L_SHOULDER_P: 240.0
      L_SHOULDER_R: 240.0
      L_SHOULDER_Y: 240.0
      L_ELBOW_P:    240.0
      L_ELBOW_Y:    240.0
      L_WRIST_P:    240.0     # valeur RHPS1 de L_WRIST_R
      L_WRIST_Y:    240.0
      L_HAND:       0.1
      R_SHOULDER_P: 240.0
      R_SHOULDER_R: 240.0
      R_SHOULDER_Y: 240.0
      R_ELBOW_P:    240.0
      R_ELBOW_Y:    240.0
      R_WRIST_P:    240.0     # valeur RHPS1 de R_WRIST_R
      R_WRIST_Y:    240.0
      R_HAND:       0.1

    # KNEES_BENT_KEYFRAME du run d'entrainement (fourni par l'auteur), en
    # precision pleine. Recoupe valeur par valeur avec les metadonnees
    # `default_joint_pos` de l'ONNX (run 2026-08-23_21-06-44), qui les arrondit
    # a 3 decimales -- les 12 entrees non nulles concordent.
    #
    # VOLONTAIREMENT PAS recopie de RHPS1, contrairement a kp/kd/effort_limit :
    # q0 n'est pas un reglage, il DEFINIT L'OBSERVATION. utils.cpp case 2
    # alimente le reseau avec
    #   jointPosDeep_[0](j) = q_mesure - q_zero(j)
    # c'est-a-dire le joint_pos_rel de mjlab. Une erreur sur q0 est un biais
    # constant sur l'entree du reseau, pas un simple decalage de posture.
    # L'ecart aux valeurs RHPS1 etait majeur : ELBOW_P -80 deg contre -30 deg,
    # soit 0.87 rad de biais permanent.
    #
    # A noter : cette pose met CROTCH_R et ANKLE_R exactement a 0, la ou RHPS1
    # les ouvre a +/-0.029 / -+0.031.
    q0:
      CHEST_Y:      0.0         # 0 deg
      CHEST_P:      0.0         # 0 deg
      HEAD_Y:       0.0         # absent du keyframe -> defaut 0, confirme par l'ONNX
      HEAD_P:       0.0         # idem
      L_SHOULDER_P: 0.261799    # 15 deg
      L_SHOULDER_R: 0.087266    # 5 deg
      L_SHOULDER_Y: -0.087266   # -5 deg
      L_ELBOW_P:    -0.523599   # -30 deg
      L_ELBOW_Y:    0.0
      L_WRIST_P:    0.0
      L_WRIST_Y:    0.0
      L_HAND:       0.0
      R_SHOULDER_P: 0.261799    # 15 deg
      R_SHOULDER_R: -0.087266   # -5 deg
      R_SHOULDER_Y: 0.087266    # 5 deg
      R_ELBOW_P:    -0.523599   # -30 deg
      R_ELBOW_Y:    0.0
      R_WRIST_P:    0.0
      R_WRIST_Y:    0.0
      R_HAND:       0.0
      L_CROTCH_Y:   0.0         # 0 deg
      L_CROTCH_R:   0.0         # 0 deg
      L_CROTCH_P:   -0.296706   # -17 deg
      L_KNEE_P:     0.628319    # 36 deg
      L_ANKLE_R:    0.0         # 0 deg
      L_ANKLE_P:    -0.331613   # -19 deg
      R_CROTCH_Y:   0.0
      R_CROTCH_R:   0.0
      R_CROTCH_P:   -0.296706   # -17 deg
      R_KNEE_P:     0.628319    # 36 deg
      R_ANKLE_R:    0.0
      R_ANKLE_P:    -0.331613   # -19 deg

    # Ordre des joints ATTENDU PAR LE RESEAU (pas celui du robot). Repris de
    # l'ordre des actionneurs de RHP7_ARTICULATION (rhp7_constants.py), qui suit
    # le meme motif que l'ONNX RHPS1 verifie : chest, head, bras G, bras D,
    # jambe G, jambe D. A confirmer contre `joint_names` de l'ONNX -- une
    # permutation ici est silencieuse et enverrait chaque commande au mauvais
    # joint.
    ref_joint_order: &rhp7_ref_joint_order
      - CHEST_Y
      - CHEST_P
      - HEAD_Y
      - HEAD_P
      - L_SHOULDER_P
      - L_SHOULDER_R
      - L_SHOULDER_Y
      - L_ELBOW_P
      - L_ELBOW_Y
      - L_WRIST_P
      - L_WRIST_Y
      - L_HAND
      - R_SHOULDER_P
      - R_SHOULDER_R
      - R_SHOULDER_Y
      - R_ELBOW_P
      - R_ELBOW_Y
      - R_WRIST_P
      - R_WRIST_Y
      - R_HAND
      - L_CROTCH_Y
      - L_CROTCH_R
