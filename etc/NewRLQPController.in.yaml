policies:
  # index 0 : RHPS1 velocity policy -- the real-robot entry.
  #
  # use_QP true (was false, 2026-07-31): the bypass path writes torques
  # straight to the robot with nothing between the policy and the hardware --
  # acceptable in mc_mujoco, not on a machine that can break. With the QP the
  # policy's output becomes a PostureTask target and the self-collision and
  # joint-limit constraint sets stay in the loop as a safety net. No
  # torque-feasibility projection: this policy did not train with one.
  - use_QP: &use_QP true
    policy_step_size: &policy_step_size 0.005   # 200 Hz (5 ms)
    physics_step_size: &physics_step_size 0.004 # mc_mujoco at 250 Hz (4 ms)
    pd_gains_ratio: &pd_gains_ratio 1.0
    # Command ranges of the 2026-07-10_20-59-17 run (completed, final
    # command_vel curriculum stage). Same final stage for index 1.
    max_vel_x: &max_vel_x 0.3
    max_vel_y: &max_vel_y 0.4
    max_yaw: &max_yaw 0.45
    joystick_deadzone: &joystick_deadzone 0.05
    vel_ramp_rate: &vel_ramp_rate 0.5

    # No posture_stiffness here on purpose: the global 1600 applies.
    #
    # An earlier note pinned 8000 in every block, reasoning that the shadowed
    # overload meant 8000 was "what actually ran". Half right. The yaml path was
    # dead, but the GUI writes pt->stiffness() straight into the task and always
    # worked -- and Leo's hardware sessions set it there. His measurement: 40000
    # trembled badly on the robot, 1600 was clearly better. Pinning 8000 would
    # have overridden the value that was actually validated on hardware.
    #
    # The margin argument agrees: sqrt(K)*dt is 1.0 at 40000 and 0.20 at 1600,
    # for dt = 0.005. mc_mujoco prefers 8000 by 14% of tracking lag, but it does
    # not model the robot's communication and sensing delays, which is exactly
    # what the margin buys. The robot's verdict wins.

    # PostureTask velocity feedforward: OFF by default, and it stays off.
    #
    # Measured 2026-08-24 on two mc_mujoco logs (18-25-28, 18-27-03), K=1600
    # both sides -- the global value in mc_rtc_superbuild.yaml AND in the
    # mujoco overlay, so there is no 40000 anywhere and an earlier note here
    # claiming there was is wrong.
    #
    # Neither half is unstable alone. refVel to the QP with the servo's
    # velocity term removed (--pd-zero-ref-vel): bounded, 37 s of walking.
    # No feedforward with the servo term present: bounded, walks. BOTH: the
    # equilibrium is linearly unstable. Toggling the feedforward on a robot
    # standing still at zero command, the state grows out of rounding noise by
    # a factor ~1.38 per 5 ms tick -- 1e-4 rad/s to saturation in under 400 ms
    # -- ending at refVel pinned to its 8 rad/s clamp, qd* at 13.2 rad/s,
    # measured joint velocity 7.7 rad/s and 2399 N.m of commanded torque.
    #
    # Why: joint velocity then enters the loop twice in series. Once inside the
    # QP, where the PostureTask objective is
    #   alphaD = K*(q* - q) + D*(refVel - alpha),  D = 2*sqrt(K) = 80
    # and once in mc_mujoco's servo, kd*(alpha_ref - alpha) with kd 240-440
    # (PDgains_sim.dat). The product of the two gains leaves the stability
    # region. The real robot has only the first: RobotHardware sends position,
    # IOB's PD has no velocity reference. So this is a simulation artifact, not
    # a property of the feedforward -- but it is exactly what a default here
    # would hand to anyone launching mc_mujoco without the flag.
    #
    # It also buys nothing. Same log, walking, PostureTask eval normalised by
    # qd*: 53.5 ms of lag without the feedforward, 63.0 ms with. The lag is the
    # task's own 1/sqrt(K) = 25 ms, and qd* cannot cancel it because the EMA at
    # alpha 0.8 delays qd* by dt*a/(1-a) = 20 ms -- the correction arrives about
    # as late as the error it is meant to pre-empt.
    #
    # To test it anyway, use the GUI button (ControlMode / Toggle posture
    # feedforward), and only with --pd-zero-ref-vel.
    posture_feedforward: false


    action_scale: &action_scale
      CHEST_Y:      0.002
      CHEST_P:      0.002
      HEAD_Y:       0.002
      HEAD_P:       0.002
      L_SHOULDER_P: 0.002
      L_SHOULDER_R: 0.002
      L_SHOULDER_Y: 0.002
      L_ELBOW_P:    0.002
      L_ELBOW_Y:    0.002
      L_WRIST_R:    0.002
      L_WRIST_Y:    0.002
      R_SHOULDER_P: 0.002
      R_SHOULDER_R: 0.002
      R_SHOULDER_Y: 0.002
      R_ELBOW_P:    0.002
      R_ELBOW_Y:    0.002
      R_WRIST_R:    0.002
      R_WRIST_Y:    0.002
      L_CROTCH_Y:   0.002625
      L_CROTCH_R:   0.0075
      L_CROTCH_P:   0.0105
      L_KNEE_P:     0.0075   # policy 0's effort_limit was 100 for this joint
      L_ANKLE_R:    0.00675
      L_ANKLE_P:    0.00975
      R_CROTCH_Y:   0.002625
      R_CROTCH_R:   0.0075
      R_CROTCH_P:   0.0105
      R_KNEE_P:     0.0075 
      R_ANKLE_R:    0.00675
      R_ANKLE_P:    0.00975

    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order

    # Horloge calee sur l'entrainement : 0.9 s des DEUX cotes de
    # l'interpolation. Les defauts du controleur sont 2.0 et 1.1, ceux des
    # index 9 a 11 ; les laisser ici faisait avancer la phase a moins de la
    # moitie du rythme attendu et le robot n'avancait pas -- 0.002 m/s
    # mesures pour 0.30 commandes.
  # index 2 (dernier, 2026-09-11) : politique low_impact d'Hippolyte, deplacee
  # du creneau 1 au creneau 2 pour laisser les deux politiques de Leo (index 0
  # et 1) en tete. obs_format: 2 EXPLICITE -- sans lui le C++ prendrait le
  # numero du creneau comme numero de `case` (NewRLQPController.cpp:306).
  # Ici les deux coincident -- creneau 2, `case 2` -- donc la cle est
  # redondante ; on la garde pour que deplacer ce bloc d'un creneau ne casse
  # rien silencieusement.
  - use_QP: true
    obs_format: 2
    # Velocity-action policy (mjlab JointVelocityAction + IdealPdActuator):
    # q_rl = measured joint position + action * policy_step_size, and the

    # commanded velocity is passed separately as qdTarget_. See
    # NewRLQPController::velocityAction_. torque_feasibility_ratio and
    # vel_target_filter_alpha below are position-action-only concepts and
    # are unused on this path; left in only because this block started as a
    # copy of a position-action entry.
    velocity_action: true
    # Feedforward refVel de la PostureTask coupe ici aussi. Le defaut de
    # postureRefVel_ est velocityAction_, donc cette entree l'aurait active :
    # c'est la seule des cinq pour laquelle setPostureRefVel() a ete ecrit
    # (qdTarget_ y est bien la sortie du reseau, pas une difference finie).
    # Desactive quand meme, sur demande, pour que les cinq creneaux tournent
    # sans feedforward de vitesse tant qu'il n'a pas ete valide sur le robot.
    posture_ref_vel: false
    #
    # --- QP-mode tuning (no effect while use_QP is false) ---
    #
    # posture_stiffness: the QP TASK's K (postureStiffness(), NOT the plant PD
    # this whole file's kp/kd maps or PDgains_sim.dat feed). Without this key
    # it falls back to 0.2/(policy_step_size*timeStep) = 0.2/(0.01*0.005) =
    # 4000 here -- a lag of 1/sqrt(K) = 15.8 ms, NOT what training saw.
    # Training modelled this exact filter (FiniteDifferencePdActuator's
    # posture_task_stiffness) at K=1600 -> 25 ms lag: set here to match the
    # plant the policy actually learned on, rather than leave it a function of
    # the control rate. Was silently dead until now: initializeRobot() and
    # applyPostureMode() called postureStiffness(), and a second, non-const
    # overload of that name (removed) shadowed the one that reads this key --
    # the override compiled, logged nothing wrong, and was never applied.
    posture_stiffness: 1600
    #
    # posture_damping: overrides the QP TASK's Kv (stiffness(K) otherwise sets
    # it automatically to 2*sqrt(K), critically damped) --
    # NewRLQPController::applyPostureDampingOverride(). NOT what the 800 rad/s
    # experiment below is about -- that one is the PLANT's damper, mc_mujoco's
    # own local PD on (q_ref, alpha_ref) (MjRobot::PD, mj_sim.cpp:30-36), read
    # from PDgains_sim.dat, a file this yaml has no key for at all. Left unset
    # (auto) here; the mechanism stays available (GUI: PostureTask > Damping)
    # for whenever the TASK's own damping is actually the thing to test.
    # posture_damping: 800
    # use_torque_task: drive the QP with a TorqueJointTask instead of the
    # PostureTask. The PostureTask route stacks two regulators -- the task,
    # then mc_mujoco's own joint PD on the (q, qdot) the QP produced -- where
    # training had one, and the QP's single coupled output cannot feed that
    # PD's two independent channels: every setting trades one for the other
    # (velocity ratio 1.00 but 61% of the position feedforward, or full
    # position bias and no holding torque at all). TorqueJointTask computes
    # tau = kp*(qd - q) + kd*(qd_dot - qdot) itself -- the training law, same
    # gains convention -- and the QP solves for the accelerations realising it
    # under the constraints.
    #
    # REQUIRES mc_mujoco started with --torque-control. Without that flag
    # sendControl() falls back to its own PD on (q_ref, alpha_ref) and every
    # torque computed here is silently discarded. Also keeps
    # dynamicsConstraint in the solver, which the kinematic route removes.
    use_torque_task: false
    #
    # qp_accel_task: hand the solver the training actuator's acceleration
    # instead of leaving it to re-derive the commanded velocity from the slope
    # of q_rl:
    #   tau   = kp*(q_rl - q_meas) + kd*(qdTarget - qdot_meas)
    #   qddot = tau / m            -> pt->refAccel()
    # Gravity and external forces are deliberately neglected: this is a
    # feedforward, not a simulation. refAccel is a native task input, so unlike
    # use_torque_task it needs no contacts and the QP stays kinematic -- the
    # output remains fully the solver's, constraints included.
    #
    # Without it, measured on the legs (bypass 1.000 in the same run):
    # velocity ratio 0.884, with the anti-windup clamp biting 36-41% of the
    # time on the knees.
    qp_accel_task: false
    #
    # joint_armature: rotor inertia added to diag(H). The mc_rtc model comes
    # from the URDF, which has none -- fd_.HIr() logs 0.00000 on every joint --
    # while the plant does: mc_mujoco's RHPS1main.xml sets armature="1" in its
    # <joint> default and mjlab's rhps1_constants.py sets armature=1.0 on every
    # actuator, so training and simulation both run with it.
    #
    # Not optional. diag(H) alone spans 13000x across the robot (L_WRIST_Y
    # 0.0003 against CHEST_P 4.26), so kp/m explodes on the light distal
    # segments: the ankles land at sqrt(kp/m)*dt = 3.9-4.6 against a stability
    # limit near 1, and the first attempt diverged exactly there (qddot
    # doubling every ~3 ticks on R_ANKLE_P, 3235 -> 17564 rad/s^2 in nine
    # ticks). With 1.0 the spread drops to 5.3x and every joint sits between
    # 0.42 and 0.68. The startup dump prints wn*dt per joint and flags anything
    # above 1 -- check it before trusting a run.
    joint_armature: 1.0
    #
    # Gains while qp_accel_task is on. Left unset, the posture task keeps its
    # own (4000 / 2*sqrt(K)) so the feedforward is ADDED to current behaviour.
    # Set both to 0 for pure feedforward -- the reference then has no pull back
    # towards q_rl while tau reads the measured state and the QP integrates its
    # own (OpenLoop), so watch ctrl_q against qIn for drift.
    # qp_accel_stiffness: 0
    # qp_accel_damping: 0
    policy_step_size: 0.01   # 100 Hz (10 ms)
    physics_step_size: 0.0025  # mc_mujoco at 400 Hz (2.5 ms)
    pd_gains_ratio: 1.0
    # Plages du run 2026-08-21, meme etage final de curriculum.
    max_vel_x: 0.3
    max_vel_y: 0.2
    max_yaw: 0.45
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5

