---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# Note: mc_rtc always adds the robot module's minimalSelfCollisions in
# MCController; this section only appends to them. The leg-leg pairs are
# removed in the controller constructor (they block lateral stepping).
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences
    # WAIKO estimator: IMU + legged odometry (no QP contacts needed).
    # imuSensor must be the real IMU (Accelerometer, gyro+accelero at the imu
    # site) -- FloatingBase is the mc_mujoco ground-truth pose sensor.
    # filterGains/leggedOdometry come from the installed default MCWaiko.yaml.
    - type: MCWaiko
      update: true
      gui: true
      imuSensor: Accelerometer
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # Ground-truth fallback (mc_mujoco perfect pose), for comparison:
    # - type: BodySensor
    #   update: true
    #   gui: true
    #   bodySensor: FloatingBase

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Every policy is BUNDLED: the files live in policy/ and CMake installs the whole
# directory to @RL_POLICY_INSTALL_PREFIX@. No absolute path to anyone's home, so
# a clone + build on the robot PC has the policies without needing mjlab-rhps1
# checked out anywhere. Adding one is: drop the .onnx in policy/, add a line here
# and a matching policies[] block.
#
# For a local experiment you can still point an entry at a training log's ONNX,
# e.g. /home/<user>/mjlab-rhps1/logs/rsl_rl/rhps1_velocity/<run>/<run>.onnx --
# but do not commit that, it breaks every other machine.
#
# ONLY INDEX 0 HAS EVER RUN ON HARDWARE (2026-08-06). Index 1 is
# simulation-validated at best; it uses an observation channel whose C++
# implementation has never been exercised on the robot. Arm from the GUI, keep a
# hand on the stop.
#
# Indices 2-4 (abl7/V4, abl15/V5, the wide-randomization posture-filter run)
# were removed 2026-08-17 -- none beat index 1, and the wide-randomization one
# had regressed on its own metrics. Full record in git history, commit 5d0fcf5
# and earlier.
policy_path: [
  # index 0: V3 (126 dims), the conservative policy that walked on the robot.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v3_2026-07-10.onnx",
  # index 1: run 2026-08-17_23-05-46, iteration 9000. Policy 0's plant restored
  # -- no PostureTask filter, no torque projection -- with the reward fixes kept,
  # the knee at 70 N.m and the wider randomisation added (actuator_gains,
  # link_com, link_inertia, push_base, sensor_bias, joint dispersion +/-0.05).
  # Observation 246 dims, utils.cpp case 1, unchanged from the previous run.
  #
  # This is the run's own export, written beside model_9000.pt at the same save,
  # not a re-export. Verified against the run's params/env.yaml: all 30
  # action_scale and q0 entries match, torque_feasibility_ratio and
  # posture_task_stiffness are null there as they are absent here.
  #
  # The training was still running when this was exported, so later checkpoints
  # exist. Re-export a specific one with:
  #   uv run python scripts/tools/export_onnx.py 2026-08-17_23-05-46 model_<it>.pt \
  #     ~/src/rl_controller/policy/rhps1_velocity_v9_nofilter_it<it>.onnx
  #
  # Plant gap to watch: this run has posture_task_stiffness null, so the network
  # never saw a posture filter, while the QP's PostureTask adds a 1/sqrt(K) lag
  # -- 25 ms at the global K=1600. posture_passthrough (GUI) is the matched
  # setting; a per-policy posture_stiffness here is the other lever. Left as is
  # until measured.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v9_nofilter_it9000.onnx",
]
# Stays 0: the real-robot entry is the only one with hardware time behind it.
default_policy_index: 0

# N*Kt per joint, to convert what the robot measures into N.m.
#
# What RobotHardware publishes on `tau` is NOT a torque on RHPS1: the VRML
# sets gearRatio=1 and torqueConst=1 for all 62 joints, so the value is really
# ratedCurrent * 0x6077/1000, a CURRENT in amps. The controller logs both:
# NewRLQPController_joint_current (A, raw) and NewRLQPController_joint_torque
# (N.m, = current * the value below).
#
# Source: scripts/ppc/joint_torque_limits_rotate.csv, type=solo rows,
# remapped 2026-08-03 after fixing the Drive<->joint association bug.
#
# Deliberately limited to the six single-motor joints. The differential pairs
# (shoulder R/Y, elbow P/Y, wrist P/Y, chest, head) have an N but no per-joint
# Kt, and the piston joints (crotch P/R, ankle P/R) have a variable lever arm
# needing CylinderToAngle. Joints absent here stay at 0 in the log rather than
# being converted with a made-up factor.
joint_torque_scale:
  L_CROTCH_Y:    9.259   # 159.0907 * 0.0582
  R_CROTCH_Y:    9.259   # 159.0907 * 0.0582
  L_KNEE_P:     21.210   # 210.0    * 0.101
  R_KNEE_P:     21.210   # 210.0    * 0.101
  L_SHOULDER_P:  9.400   # 200.0    * 0.047
  R_SHOULDER_P:  9.400   # 200.0    * 0.047

# kp/kd/q0/ref_joint_order below are identical for index 0 and index 1: PD
# gains and reference pose are a hardware/QP choice, not something the
# training run decides. Anchored once here so policies[] does not repeat 114
# lines per index -- not read directly, the controller only looks up
# `policies` and `policy_path`, so this key is inert to it.
