---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# This block is the ONLY thing that actually puts a self-collision constraint
# in the solver: MCController.cpp:322-331 builds a CollisionsConstraint from
# the "collisions" key and calls solver().addConstraintSet() on it. The
# selfCollisionConstraint member tweaked in NewRLQPController's constructor
# (thigh iDist correction, setCollisionsDampers) is a SEPARATE object that is
# never added to the solver, so editing it there changes nothing -- and
# commenting this block out is what actually disables the protection.
#
# Briefly disabled on 2026-08-07 to test whether self-collision explained the
# QP-vs-bypass gap. It did not; restored.
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences
    # WAIKO estimator: IMU + legged odometry (no QP contacts needed).
    # imuSensor must be the real IMU (Accelerometer, gyro+accelero at the imu
    # site) -- FloatingBase is the mc_mujoco ground-truth pose sensor.
    # filterGains/leggedOdometry come from the installed default MCWaiko.yaml.
    - type: MCWaiko
      update: true
      gui: true
      imuSensor: Accelerometer
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # Ground-truth fallback (mc_mujoco perfect pose), for comparison:
    # - type: BodySensor
    #   update: true
    #   gui: true
    #   bodySensor: FloatingBase

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Every policy is BUNDLED: the files live in policy/ and CMake installs the whole
# directory to @RL_POLICY_INSTALL_PREFIX@. No absolute path to anyone's home, so
# a clone + build on the robot PC has the policies without needing mjlab-rhps1
# checked out anywhere. Adding one is: drop the .onnx in policy/, add a line here
# and a matching policies[] block.
#
# For a local experiment you can still point an entry at a training log's ONNX,
# e.g. /home/<user>/mjlab-rhps1/logs/rsl_rl/rhps1_velocity/<run>/<run>.onnx --
# but do not commit that, it breaks every other machine.
#
# ONLY INDEX 0 HAS EVER RUN ON HARDWARE (2026-08-06). Index 1 is
# simulation-validated at best; it uses an observation channel whose C++
# implementation has never been exercised on the robot. Arm from the GUI, keep a
# hand on the stop.
#
# Indices 2-4 (abl7/V4, abl15/V5, the wide-randomization posture-filter run)
# were removed 2026-08-17 -- none beat index 1, and the wide-randomization one
# had regressed on its own metrics. Full record in git history, commit 5d0fcf5
# and earlier.
policy_path: [
  # index 0: V3 (126 dims), the conservative policy that walked on the robot.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v3_2026-07-10.onnx",
  # index 1: run 2026-08-22_04-28-49, checkpoint model_7800 (iteration 7800).
  # Reverted here after testing rhps1_stride_it13950.onnx on the robot and
  # judging it not good enough. it13950 is where standing_single_support_rate
  # crosses from 0.267 (this checkpoint) to 0.979 -- the robot holds itself on
  # one leg ~98% of the time it is given no command -- and eight hours of
  # reward changes across 2026-08-23/24 (standing_single_support weight up to
  # -40, direction_progress given its own tighter standing kernel) never moved
  # that rate. Full comparison and the chain of every rung in between:
  # mjlab-rhps1/docs/gait_redirection_path.md.
  #
  # Chosen as the safe weekend pick on every safety metric against the two
  # later candidates (it13950, it27300):
  #
  #                       standing_1leg  clipping  torque  impact_vel
  #   it7800 (this)            0.267      0.153    0.427    0.141
  #   it13950                  0.979      0.224    0.483    0.126
  #   it27300                  0.985      0.198    0.454    0.142
  #
  # velocity_damper reads 0.0663 at export -- the deployment plant's projection
  # was barely in the training loop. Treat as a mc_mujoco / cautious-robot
  # candidate, not as trained-against-the-QP the way it13950 was.
  #
  #   step period  0.32 s   (2.9 cm / 0.148 s on the lift policy)
  #   falls        4.4%
  # p0+rand+lift+steplen+freevel+freeroll, resumed from the lift lineage that
  # walked on the robot. On top of the foot package (min_foot_height 8 cm ->
  # 2 cm with a 60 ms liftoff ramp, foot_swing_height target 0.15 -> 0.03,
  # air_time threshold_max 0.25, curriculum removed), three reward changes that
  # only remove or add pressure -- observations and actions are untouched:
  #
  #   freevel   direction_progress replaces most of track_linear_velocity. The
  #             std-0.20 isotropic kernel scored instantaneous velocity, and a
  #             real step is oscillatory in every component, so it cut 76% of
  #             the term for a plausible step profile and selected the shuffle.
  #   freeroll  roll/pitch split off yaw in track_angular_velocity (std_xy 0.8):
  #             the lateral weight transfer was priced as a tracking failure.
  #   steplen   com_step_progress, paid per debounced touchdown, squared, on
  #             CoM displacement and step period, both walked by a curriculum.
  #
  # Measured against the lift baseline: step length 2.9 -> 5.5 cm, step period
  # 0.148 -> 0.29 s, peak foot height 1.8 -> 3.1 mm, lateral sway +36%.
  #
  # The previous occupant of this slot, rhps1_velocity_lift_it2100.onnx, is the
  # one with real-robot time behind it and is still in policy/ -- put the path
  # back to revert.
  #
  # 126 dims, NOT 246: this is policy 0's observation format, so utils.cpp now
  # lists index 1 with case 0. Verified against the run: obs [1,126],
  # actions [1,30], history 5 on base_lin_vel and command only, and all 21
  # action_scale plus 30 q0 entries match the config exactly (the ONNX metadata
  # prints them at %.3f, so 0.002625 reads as 0.003 -- a display artifact, not a
  # disagreement).
  #
  # NOT a real-robot candidate, and less of one than its predecessor was.
  # velocity_damper -- the curriculum that ramps in the mc_rtc
  # KinematicsConstraint damper, i.e. the deployment plant -- reads 0.0663 at
  # iteration 7849: it starts at 7500 and is full at 12750, so this policy has
  # barely begun to see it. Torque clipping is also up, 10% -> 15.4% of
  # joint-samples, concentrated in the wrists (37%) rather than the legs
  # (12.7% mean). For mc_mujoco, to find out whether the longer stride survives
  # the QP at all.
  #
  # Re-export a later checkpoint with:
  #   RHPS1_ABLATION=p0+rand+lift+steplen+freevel+freeroll+dense+calm \
  #     uv run python scripts/tools/export_onnx.py \
  #     <run> model_<it>.pt \
  #     ~/src/rl_controller/policy/rhps1_stride_it<it>.onnx
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_it7800_conservative.onnx",
  # index 2: velocity-action policy (mjlab JointVelocityAction +
  # IdealPdActuator, obs 4080 = 40x102). The ONLY entry with
  # velocity_action: true -- q_rl is a free-running integral of the commanded
  # velocity instead of being rebuilt from q_zero. utils.cpp case 2.
  "@RL_POLICY_INSTALL_PREFIX@/2026-08-20_18-46-29.onnx",
]
# Stays 0: the real-robot entry is the only one with hardware time behind it.
# Back to 0 on 2026-08-21 for a real-robot session. Index 0 is the only entry
# with hardware time behind it; whatever is being tested gets selected from the
# GUI, so the default is what the controller falls back to, not what anyone
# intends to run. It had been left at 2 by a merge.
default_policy_index: 0

# N*Kt per joint, to convert what the robot measures into N.m.
#
# What RobotHardware publishes on `tau` is NOT a torque on RHPS1: the VRML
# sets gearRatio=1 and torqueConst=1 for all 62 joints, so the value is really
# ratedCurrent * 0x6077/1000, a CURRENT in amps. The controller logs both:
# NewRLQPController_joint_current (A, raw) and NewRLQPController_joint_torque
# (N.m, = current * the value below).
#
# Source: scripts/ppc/joint_torque_limits_rotate.csv, synced 2026-08-21 with
# Leonassim/RHPS1_gains. The Kt before that sync were wrong -- 0.0582/0.101/0.047
# against nameplate 0.116/0.424/0.246 -- so every torque this table produced was
# understated by 2.0x, 4.2x or 5.2x depending on the joint. Do not hand-edit:
# mc-rtc-superbuild/scripts/ppc/apply_kt.py writes all four files that carry
# these constants together.
#
# Deliberately limited to the six single-motor joints. Chest now has a Kt
# (0.246) but stays out anyway: its two drives are ChestYPL = P+Y and
# ChestYPR = P-Y, and the IOB sums the current over a joint's drives with no
# sign, which is the common mode. That sum is right for CHEST_P and wrong for
# CHEST_Y, and one scale cannot be both. The other differential pairs (shoulder
# R/Y, elbow P/Y, wrist P/Y, head) still have no sourced Kt, and the piston
# joints (crotch P/R, ankle P/R) have a variable lever arm needing
# CylinderToAngle. Joints absent here stay at 0 in the log rather than being
# converted with a made-up factor.
joint_torque_scale:
  L_CROTCH_Y:    18.455   # 159.091 * 0.116
  R_CROTCH_Y:    18.455   # 159.091 * 0.116
  L_KNEE_P:     89.040   # 210 * 0.424
  R_KNEE_P:     89.040   # 210 * 0.424
  L_SHOULDER_P:  49.200   # 200 * 0.246
  R_SHOULDER_P:  49.200   # 200 * 0.246

# kp/kd/q0/ref_joint_order below are identical for index 0 and index 1: PD
# gains and reference pose are a hardware/QP choice, not something the
# training run decides. Anchored once here so policies[] does not repeat 114
# lines per index -- not read directly, the controller only looks up
# `policies` and `policy_path`, so this key is inert to it.
x_shared_plant:
  kp: &kp
    L_CROTCH_Y:   20000.0
    L_CROTCH_R:   20000.0
    L_CROTCH_P:   20000.0
    L_KNEE_P:     20000.0
    L_ANKLE_R:    10000.0
    L_ANKLE_P:    10000.0
    CHEST_Y:      44000.0
    CHEST_P:      44000.0
    R_CROTCH_Y:   20000.0
    R_CROTCH_R:   20000.0
    R_CROTCH_P:   20000.0
    R_KNEE_P:     20000.0
    R_ANKLE_R:    10000.0
    R_ANKLE_P:    10000.0
    HEAD_Y:       2000.0
    HEAD_P:       2000.0
    L_SHOULDER_P: 15000.0
    L_SHOULDER_R: 14000.0
    L_SHOULDER_Y: 14000.0
    L_ELBOW_P:    14000.0
    L_ELBOW_Y:    14000.0
    L_WRIST_R:    14000.0
    L_WRIST_Y:    14000.0
    R_SHOULDER_P: 15000.0
    R_SHOULDER_R: 14000.0
    R_SHOULDER_Y: 14000.0
    R_ELBOW_P:    14000.0
    R_ELBOW_Y:    14000.0
    R_WRIST_R:    14000.0
    R_WRIST_Y:    14000.0
  kd: &kd
    L_CROTCH_Y:   400.0
    L_CROTCH_R:   400.0
    L_CROTCH_P:   400.0
    L_KNEE_P:     400.0
    L_ANKLE_R:    300.0
    L_ANKLE_P:    300.0
    CHEST_Y:      440.0
    CHEST_P:      440.0
    R_CROTCH_Y:   400.0
    R_CROTCH_R:   400.0
    R_CROTCH_P:   400.0
    R_KNEE_P:     400.0
    R_ANKLE_R:    300.0
    R_ANKLE_P:    300.0
    HEAD_Y:       50.0
    HEAD_P:       50.0
    L_SHOULDER_P: 240.0
    L_SHOULDER_R: 240.0
    L_SHOULDER_Y: 240.0
    L_ELBOW_P:    240.0
    L_ELBOW_Y:    240.0
    L_WRIST_R:    240.0
    L_WRIST_Y:    240.0
    R_SHOULDER_P: 240.0
    R_SHOULDER_R: 240.0
    R_SHOULDER_Y: 240.0
    R_ELBOW_P:    240.0
    R_ELBOW_Y:    240.0
    R_WRIST_R:    240.0
    R_WRIST_Y:    240.0
  q0: &q0
    CHEST_Y:      0.0
    CHEST_P:      0.0
    HEAD_Y:       0.0
    HEAD_P:       0.0
    L_SHOULDER_P: 0.261799
    L_SHOULDER_R: 0.174533
    L_SHOULDER_Y: -0.087266
    L_ELBOW_P:    -0.523599
    L_ELBOW_Y:    0.0
    L_WRIST_R:    0.0
    L_WRIST_Y:    0.0
    R_SHOULDER_P: 0.261799
    R_SHOULDER_R: -0.174533
    R_SHOULDER_Y: 0.087266
    R_ELBOW_P:    -0.523599
    R_ELBOW_Y:    0.0
    R_WRIST_R:    0.0
    R_WRIST_Y:    0.0
    L_CROTCH_Y:   -0.010533
    L_CROTCH_R:   0.028787
    L_CROTCH_P:   -0.271191
    L_KNEE_P:     0.622021
    L_ANKLE_R:    -0.030652
    L_ANKLE_P:    -0.350679
    R_CROTCH_Y:   0.010533
    R_CROTCH_R:   -0.028787
    R_CROTCH_P:   -0.271191
    R_KNEE_P:     0.622021
    R_ANKLE_R:    0.030652
    R_ANKLE_P:    -0.350679
  ref_joint_order: &ref_joint_order
    - CHEST_Y
    - CHEST_P
    - HEAD_Y
    - HEAD_P
    - L_SHOULDER_P
    - L_SHOULDER_R
    - L_SHOULDER_Y
    - L_ELBOW_P
    - L_ELBOW_Y
    - L_WRIST_R
    - L_WRIST_Y
    - R_SHOULDER_P
    - R_SHOULDER_R
    - R_SHOULDER_Y
    - R_ELBOW_P
    - R_ELBOW_Y
    - R_WRIST_R
    - R_WRIST_Y
    - L_CROTCH_Y
    - L_CROTCH_R
    - L_CROTCH_P
    - L_KNEE_P
    - L_ANKLE_R
    - L_ANKLE_P
    - R_CROTCH_Y
    - R_CROTCH_R
    - R_CROTCH_P
    - R_KNEE_P
    - R_ANKLE_R
    - R_ANKLE_P

policies:
  # index 0 : RHPS1 velocity policy -- the real-robot entry.
  #
  # use_QP true (was false, 2026-07-31): the bypass path writes torques
  # straight to the robot with nothing between the policy and the hardware --
  # acceptable in mc_mujoco, not on a machine that can break. With the QP the
  # policy's output becomes a PostureTask target and the self-collision and
  # joint-limit constraint sets stay in the loop as a safety net. No
  # torque-feasibility projection: this policy did not train with one.
  - use_QP: &use_QP true
    policy_step_size: &policy_step_size 0.005   # 200 Hz (5 ms)
    physics_step_size: &physics_step_size 0.004 # mc_mujoco at 250 Hz (4 ms)
    pd_gains_ratio: &pd_gains_ratio 1.0
    # Command ranges of the 2026-07-10_20-59-17 run (completed, final
    # command_vel curriculum stage). Same final stage for index 1.
    max_vel_x: &max_vel_x 0.3
    max_vel_y: &max_vel_y 0.4
    max_yaw: &max_yaw 0.45
    joystick_deadzone: &joystick_deadzone 0.05
    vel_ramp_rate: &vel_ramp_rate 0.5

    action_scale:
      CHEST_Y:      0.002
      CHEST_P:      0.002
      HEAD_Y:       0.002
      HEAD_P:       0.002
      L_SHOULDER_P: 0.002
      L_SHOULDER_R: 0.002
      L_SHOULDER_Y: 0.002
      L_ELBOW_P:    0.002
      L_ELBOW_Y:    0.002
      L_WRIST_R:    0.002
      L_WRIST_Y:    0.002
      R_SHOULDER_P: 0.002
      R_SHOULDER_R: 0.002
      R_SHOULDER_Y: 0.002
      R_ELBOW_P:    0.002
      R_ELBOW_Y:    0.002
      R_WRIST_R:    0.002
      R_WRIST_Y:    0.002
      L_CROTCH_Y:   0.002625
      L_CROTCH_R:   0.0075
      L_CROTCH_P:   0.0105
      L_KNEE_P:     0.0075   # policy 0's effort_limit was 100 for this joint
      L_ANKLE_R:    0.00675
      L_ANKLE_P:    0.00975
      R_CROTCH_Y:   0.002625
      R_CROTCH_R:   0.0075
      R_CROTCH_P:   0.0105
      R_KNEE_P:     0.0075 
      R_ANKLE_R:    0.00675
      R_ANKLE_P:    0.00975

    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order

  # index 1 : run 2026-08-17_00-34-31, checkpoint 10350 (interim -- run still
  # training, see policy_path above).
  #
  # Back to policy 0's exact randomization, its buggy rewards fixed, and the
  # PostureTask delay filter added. This is the run that closed the
  # train/play gap seen all session: confirmed walking in both wandb videos
  # and `uv run play` on 2026-08-17.
  #
  # OBSERVATION 246 DIMS, utils.cpp case 1 (shared with the old index 4): the
  # body-only vector, no gait_phase, no raw_torque. 15+3+3+30+30+150+15 = 246.
  #
  # posture_stiffness OVERRIDE DISABLED 2026-08-17 for a live test: with it at
  # 1600 the robot splayed its legs and did not walk in mc_mujoco, where the
  # global default is 40000 -- a uniform 25x softer PostureTask than policy 0
  # gets (which has no override and inherits the 40000 global). The delay
  # argument below (1/sqrt(K) independent of dt) is about a decoupled
  # per-joint oscillator; the real QP task is coupled through the whole
  # floating-base dynamics, self-collision and contact constraints, where
  # under-stiffness can plausibly lose to gravity instead of just adding lag.
  # Testing without the override first to isolate the variable before
  # concluding anything.
  #
  # Original reasoning, kept for when this gets revisited: this policy
  # trained against the second-order PostureTask filter at K=1600 -- the
  # filter is part of the plant it learned, so the stiffness is a property of
  # the policy, not of the environment. 1600 at 200 Hz and 40000 at 1 kHz
  # both give sqrt(K)*dt = 0.20 (equal numerical stability margin) but not
  # the same physical delay: delay is 1/sqrt(K), independent of dt -- 25 ms
  # at K=1600 vs 5 ms at K=40000. The policy learned 25 ms, it must see 25 ms.
  - use_QP: *use_QP
    policy_step_size: *policy_step_size
    physics_step_size: *physics_step_size
    pd_gains_ratio: *pd_gains_ratio
    # NO posture_filter_stiffness and NO torque_feasibility_ratio: run
    # 2026-08-17_23-05-46 has neither (_POSTURE_TASK_STIFFNESS = None,
    # _TORQUE_FEASIBILITY_RATIO = None), back to policy 0's plant. Declaring
    # either would put back in deployment exactly the two stages the run drops.
    # applyPostureFilter() and projectTorqueFeasible() both early-return without
    # them, so no code needs disabling.
    max_vel_x: *max_vel_x
    max_vel_y: *max_vel_y
    max_yaw: *max_yaw
    joystick_deadzone: *joystick_deadzone
    vel_ramp_rate: *vel_ramp_rate

    # qd* as the training PD receives it: EMA-filtered finite difference of the
    # target, per-joint clamp. Policy 0's run had these too, so they are not part
    # of what was removed.
    vel_target_filter_alpha: 0.8

    # Velocity damper, the stage mjlab runs between qd* and the projection. NOT
    # optional for the observation: _executed_position_target is allocated
    # unconditionally, so executed_action reads the POST-damper target even with
    # the projection off. Under the QP mc_rtc's KinematicsConstraint covers the
    # command, but nothing covered the observation, and the bypass path had no
    # damper at all.
    velocity_damper_di: 0.4
    velocity_damper_ds: 0.01
    velocity_damper_vel_percent: 0.9


    # mjlab's mj_model.jnt_range, the bounds its damper measures its zone
    # against. Declared here rather than read from the robot module: the zone is
    # a fraction of the range, so a different range is a different plant, and a
    # silent mismatch is exactly what this file exists to prevent.
    joint_limits:
      CHEST_Y:        [ -0.52360,   0.52360]
      CHEST_P:        [ -0.52360,   1.22173]
      HEAD_Y:         [ -3.14159,   3.14159]
      HEAD_P:         [ -0.52360,   0.52360]
      L_SHOULDER_P:   [ -3.14159,   3.14159]
      L_SHOULDER_R:   [ -0.69813,   1.83260]
      L_SHOULDER_Y:   [ -3.14159,   3.14159]
      L_ELBOW_P:      [ -2.35619,   0.00000]
      L_ELBOW_Y:      [ -3.14159,   3.14159]
      L_WRIST_R:      [ -0.87267,   1.57080]
      L_WRIST_Y:      [ -1.57080,   1.57080]
      R_SHOULDER_P:   [ -3.14159,   3.14159]
      R_SHOULDER_R:   [ -1.83260,   0.69813]
      R_SHOULDER_Y:   [ -3.14159,   3.14159]
      R_ELBOW_P:      [ -2.35619,   0.00000]
      R_ELBOW_Y:      [ -3.14159,   3.14159]
      R_WRIST_R:      [ -1.57080,   0.87267]
      R_WRIST_Y:      [ -1.57080,   1.57080]
      L_CROTCH_Y:     [ -1.57080,   1.57080]
      L_CROTCH_R:     [ -0.62832,   0.62832]
      L_CROTCH_P:     [ -1.91986,   0.61086]
      L_KNEE_P:       [  0.00000,   2.44346]
      L_ANKLE_R:      [ -0.52360,   0.52360]
      L_ANKLE_P:      [ -1.57080,   0.69813]
      R_CROTCH_Y:     [ -1.57080,   1.57080]
      R_CROTCH_R:     [ -0.62832,   0.62832]
      R_CROTCH_P:     [ -1.91986,   0.61086]
      R_KNEE_P:       [  0.00000,   2.44346]
      R_ANKLE_R:      [ -0.52360,   0.52360]
      R_ANKLE_P:      [ -1.57080,   0.69813]

    # velocity_limits: training sets these equal to velocity_target_limit; the
    # damper clamps qd* at vel_percent * this.
    velocity_limits:
      CHEST_Y:        6
      CHEST_P:        6
      HEAD_Y:         4
      HEAD_P:         4
      L_SHOULDER_P:   6
      L_SHOULDER_R:   6
      L_SHOULDER_Y:   6
      L_ELBOW_P:      6
      L_ELBOW_Y:      6
      L_WRIST_R:      6
      L_WRIST_Y:      6
      R_SHOULDER_P:   6
      R_SHOULDER_R:   6
      R_SHOULDER_Y:   6
      R_ELBOW_P:      6
      R_ELBOW_Y:      6
      R_WRIST_R:      6
      R_WRIST_Y:      6
      L_CROTCH_Y:     8
      L_CROTCH_R:     8
      L_CROTCH_P:     8
