---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# This block is the ONLY thing that actually puts a self-collision constraint
# in the solver: MCController.cpp:322-331 builds a CollisionsConstraint from
# the "collisions" key and calls solver().addConstraintSet() on it. The
# selfCollisionConstraint member tweaked in NewRLQPController's constructor
# (thigh iDist correction, setCollisionsDampers) is a SEPARATE object that is
# never added to the solver, so editing it there changes nothing -- and
# commenting this block out is what actually disables the protection.
#
# Briefly disabled on 2026-08-07 to test whether self-collision explained the
# QP-vs-bypass gap. It did not; restored.
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences
    # WAIKO estimator: IMU + legged odometry (no QP contacts needed).
    # imuSensor must be the real IMU (Accelerometer, gyro+accelero at the imu
    # site) -- FloatingBase is the mc_mujoco ground-truth pose sensor.
    # filterGains/leggedOdometry come from the installed default MCWaiko.yaml.
    - type: MCWaiko
      update: true
      gui: true
      imuSensor: Accelerometer
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # Ground-truth fallback (mc_mujoco perfect pose), for comparison:
    # - type: BodySensor
    #   update: true
    #   gui: true
    #   bodySensor: FloatingBase

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Toutes les politiques sont EMBARQUEES : les fichiers vivent dans policy/ et
# CMake installe le repertoire entier vers @RL_POLICY_INSTALL_PREFIX@. Aucun
# chemin absolu vers le home de qui que ce soit, donc un clone + build sur le PC
# du robot a les politiques sans avoir mjlab-rhps1 nulle part.
#
# Liste ramenee a trois entrees le 2026-09-10. Les onze autres sont dans
# l'historique git : aucune ne valait mieux qu'une autre au banc, et toutes
# partageaient le meme defaut (95 % d'appui simple, 3.6 mm de lever de pied,
# emballement vers l'avant). Les trois blocs RHP7 partent avec -- autre robot,
# autre MainRobot, autre module.
#
#   0  policy 0 -- la SEULE a avoir tourne sur le robot (2026-08-06). On n'y
#      touche pas : c'est la reference de couple et de securite.
#   1  la politique d'un collegue (Hippolyte), velocity-action, 4080 dims.
#      Validee en simulation seulement.
#   2  CRENEAU D'ESSAI. C'est celui-la qu'on remplace a chaque politique a
#      tester ; les deux autres ne bougent jamais.
#
# obs_format est declare EXPLICITEMENT sur les index 1 et 2. Sans lui le C++
# prend le numero du creneau comme numero de `case` (NewRLQPController.cpp:306),
# donc deplacer une politique d'un creneau a l'autre changerait en silence le
# format d'observation qu'on lui presente.
#
# ARMER DEPUIS LA GUI, une main sur l'arret.
policy_path: [
  # index 0 : V3 (126 dims), la politique conservative qui a marche sur le robot.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v3_2026-07-10.onnx",
  # index 1 : politique d'Hippolyte -- mjlab JointVelocityAction + IdealPdActuator,
  # obs 4080 = 40x102. La SEULE entree avec velocity_action: true : q_rl y est
  # l'integrale libre de la vitesse commandee au lieu d'etre reconstruite depuis
  # q_zero. utils.cpp case 2, d'ou obs_format: 2 sur son bloc.
  # rhps1_low_impact.onnx a ete reference le 2026-08-31 (commit 3b68bcd) mais le
  # fichier n'a jamais ete ajoute au depot : ce creneau pointait dans le vide et
  # mc_rtc ne demarrait pas. Remplace par la plus recente des trois politiques
  # 4080 dims d'Hippolyte (commit cf59ede, 2026-08-21). A CONFIRMER : les deux
  # autres sont 2026-08-06_15-18-01.onnx et 2026-08-09_00-06-45.onnx.
  "@RL_POLICY_INSTALL_PREFIX@/2026-08-20_18-46-29.onnx",
  # index 2 : creneau d'essai -- run 2026-09-10_15-27-45, model_26850, 530 dims.
  # Reprise de 2026-09-10_09-47-21 (l'ancien index 13) avec exactement la meme
  # configuration : RHPS1_W_STANDSS=-24 etait ecrase par ablation.py:235 qui
  # force -4.0. Damper de vitesse a 0.4 (Curriculum/velocity_damper = 1.0 des la
  # reprise), horloge 0.9 s, echelles d'action exactes du run.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_p6_it26850.onnx",
]
# Stays 0: the real-robot entry is the only one with hardware time behind it.
# Back to 0 on 2026-08-21 for a real-robot session. Index 0 is the only entry
# with hardware time behind it; whatever is being tested gets selected from the
# GUI, so the default is what the controller falls back to, not what anyone
# intends to run. It had been left at 2 by a merge.
#
# 6, 7, 8 = RHP7 Kaleido (obs_format: 6 on their blocks, see the comment on
# policy_path above -- NOT the same number as their own index). Doit rester
# coherent avec MainRobot dans mc_rtc.yaml : 0-5 exigent RHPS1_MuJoCo, 6-8
# exigent RHP7. Un index incoherent avec le robot charge leve std::out_of_range
# dans initializeRobot() (les maps kp/kd/q0 sont lues avec .at() sur le
# refJointOrder du robot courant).
# REMIS A 0 le 2026-08-31. Le commit 3b68bcd l'avait passe a 7, soit
# rhp7test.onnx : sur un RHPS1 -- le robot que le lanceur mc_mujoco charge via
# mc_rtc_superbuild_mujoco.yaml -- ca leve std::out_of_range au demarrage, avant
# meme d'atteindre la GUI. Le defaut est ce sur quoi le controleur RETOMBE, pas
# ce que quelqu'un a l'intention de lancer : ce qu'on teste se choisit depuis la
# GUI. 0 est la seule entree avec du temps materiel derriere elle.
#
# Pour travailler sur RHP7, lancer avec MainRobot: RHP7 et selectionner 6, 7 ou
# 8 dans la GUI -- le defaut n'a pas a porter ce choix.
#
# Cette branche ne porte que RHPS1 : les entrees RHP7 Kaleido (anciens index
# 6/7/8) sont parties sur la branche `rhp7` le 2026-09-01. Exige donc
# MainRobot: RHPS1_MuJoCo dans mc_rtc.yaml. Un index incoherent avec le robot
# charge leve std::out_of_range dans initializeRobot() (les maps kp/kd/q0 sont
# lues avec .at() sur le refJointOrder du robot courant).
default_policy_index: 0

# N*Kt per joint, to convert what the robot measures into N.m.
#
# What RobotHardware publishes on `tau` is NOT a torque on RHPS1: the VRML
# sets gearRatio=1 and torqueConst=1 for all 62 joints, so the value is really
# ratedCurrent * 0x6077/1000, a CURRENT in amps. The controller logs both:
# NewRLQPController_joint_current (A, raw) and NewRLQPController_joint_torque
# (N.m, = current * the value below).
#
# Source: scripts/ppc/joint_torque_limits_rotate.csv, synced 2026-08-21 with
# Leonassim/RHPS1_gains. The Kt before that sync were wrong -- 0.0582/0.101/0.047
# against nameplate 0.116/0.424/0.246 -- so every torque this table produced was
# understated by 2.0x, 4.2x or 5.2x depending on the joint. Do not hand-edit:
# mc-rtc-superbuild/scripts/ppc/apply_kt.py writes all four files that carry
# these constants together.
#
# Deliberately limited to the six single-motor joints. Chest now has a Kt
# (0.246) but stays out anyway: its two drives are ChestYPL = P+Y and
# ChestYPR = P-Y, and the IOB sums the current over a joint's drives with no
# sign, which is the common mode. That sum is right for CHEST_P and wrong for
# CHEST_Y, and one scale cannot be both. The other differential pairs (shoulder
# R/Y, elbow P/Y, wrist P/Y, head) still have no sourced Kt, and the piston
# joints (crotch P/R, ankle P/R) have a variable lever arm needing
# CylinderToAngle. Joints absent here stay at 0 in the log rather than being
# converted with a made-up factor.
joint_torque_scale:
  L_CROTCH_Y:    18.455   # 159.091 * 0.116
  R_CROTCH_Y:    18.455   # 159.091 * 0.116
  L_KNEE_P:     89.040   # 210 * 0.424
  R_KNEE_P:     89.040   # 210 * 0.424
  L_SHOULDER_P:  49.200   # 200 * 0.246
  R_SHOULDER_P:  49.200   # 200 * 0.246

# kp/kd/q0/ref_joint_order below are identical for index 0 and index 1: PD
# gains and reference pose are a hardware/QP choice, not something the
# training run decides. Anchored once here so policies[] does not repeat 114
# lines per index -- not read directly, the controller only looks up
# `policies` and `policy_path`, so this key is inert to it.
x_shared_plant:
  kp: &kp
    L_CROTCH_Y:   20000.0
    L_CROTCH_R:   20000.0
    L_CROTCH_P:   20000.0
    L_KNEE_P:     20000.0
    L_ANKLE_R:    10000.0
    L_ANKLE_P:    10000.0
    CHEST_Y:      44000.0
    CHEST_P:      44000.0
    R_CROTCH_Y:   20000.0
    R_CROTCH_R:   20000.0
    R_CROTCH_P:   20000.0
    R_KNEE_P:     20000.0
    R_ANKLE_R:    10000.0
    R_ANKLE_P:    10000.0
    HEAD_Y:       2000.0
    HEAD_P:       2000.0
    L_SHOULDER_P: 15000.0
    L_SHOULDER_R: 14000.0
    L_SHOULDER_Y: 14000.0
    L_ELBOW_P:    14000.0
    L_ELBOW_Y:    14000.0
    L_WRIST_R:    14000.0
    L_WRIST_Y:    14000.0
    R_SHOULDER_P: 15000.0
    R_SHOULDER_R: 14000.0
    R_SHOULDER_Y: 14000.0
    R_ELBOW_P:    14000.0
    R_ELBOW_Y:    14000.0
    R_WRIST_R:    14000.0
    R_WRIST_Y:    14000.0
  kd: &kd
    L_CROTCH_Y:   400.0
    L_CROTCH_R:   400.0
    L_CROTCH_P:   400.0
    L_KNEE_P:     400.0
    L_ANKLE_R:    300.0
    L_ANKLE_P:    300.0
    CHEST_Y:      440.0
    CHEST_P:      440.0
    R_CROTCH_Y:   400.0
    R_CROTCH_R:   400.0
    R_CROTCH_P:   400.0
    R_KNEE_P:     400.0
    R_ANKLE_R:    300.0
    R_ANKLE_P:    300.0
    HEAD_Y:       50.0
    HEAD_P:       50.0
    L_SHOULDER_P: 240.0
    L_SHOULDER_R: 240.0
    L_SHOULDER_Y: 240.0
    L_ELBOW_P:    240.0
    L_ELBOW_Y:    240.0
    L_WRIST_R:    240.0
    L_WRIST_Y:    240.0
    R_SHOULDER_P: 240.0
    R_SHOULDER_R: 240.0
    R_SHOULDER_Y: 240.0
    R_ELBOW_P:    240.0
    R_ELBOW_Y:    240.0
    R_WRIST_R:    240.0
    R_WRIST_Y:    240.0
  q0: &q0
    CHEST_Y:      0.0
    CHEST_P:      0.0
    HEAD_Y:       0.0
    HEAD_P:       0.0
    L_SHOULDER_P: 0.261799
    L_SHOULDER_R: 0.174533
    L_SHOULDER_Y: -0.087266
    L_ELBOW_P:    -0.523599
    L_ELBOW_Y:    0.0
    L_WRIST_R:    0.0
    L_WRIST_Y:    0.0
    R_SHOULDER_P: 0.261799
    R_SHOULDER_R: -0.174533
    R_SHOULDER_Y: 0.087266
    R_ELBOW_P:    -0.523599
    R_ELBOW_Y:    0.0
    R_WRIST_R:    0.0
    R_WRIST_Y:    0.0
    L_CROTCH_Y:   -0.010533
    L_CROTCH_R:   0.028787
    L_CROTCH_P:   -0.271191
    L_KNEE_P:     0.622021
    L_ANKLE_R:    -0.030652
    L_ANKLE_P:    -0.350679
    R_CROTCH_Y:   0.010533
    R_CROTCH_R:   -0.028787
    R_CROTCH_P:   -0.271191
    R_KNEE_P:     0.622021
    R_ANKLE_R:    0.030652
    R_ANKLE_P:    -0.350679
  ref_joint_order: &ref_joint_order
    - CHEST_Y
    - CHEST_P
    - HEAD_Y
    - HEAD_P
    - L_SHOULDER_P
    - L_SHOULDER_R
    - L_SHOULDER_Y
    - L_ELBOW_P
    - L_ELBOW_Y
    - L_WRIST_R
    - L_WRIST_Y
    - R_SHOULDER_P
    - R_SHOULDER_R
    - R_SHOULDER_Y
    - R_ELBOW_P
    - R_ELBOW_Y
    - R_WRIST_R
    - R_WRIST_Y
    - L_CROTCH_Y
    - L_CROTCH_R
    - L_CROTCH_P
    - L_KNEE_P
    - L_ANKLE_R
    - L_ANKLE_P
    - R_CROTCH_Y
    - R_CROTCH_R
    - R_CROTCH_P
    - R_KNEE_P
    - R_ANKLE_R
    - R_ANKLE_P

policies:
  # index 0 : RHPS1 velocity policy -- the real-robot entry.
  #
  # use_QP true (was false, 2026-07-31): the bypass path writes torques
  # straight to the robot with nothing between the policy and the hardware --
  # acceptable in mc_mujoco, not on a machine that can break. With the QP the
  # policy's output becomes a PostureTask target and the self-collision and
  # joint-limit constraint sets stay in the loop as a safety net. No
  # torque-feasibility projection: this policy did not train with one.
  - use_QP: &use_QP true
    policy_step_size: &policy_step_size 0.005   # 200 Hz (5 ms)
    physics_step_size: &physics_step_size 0.004 # mc_mujoco at 250 Hz (4 ms)
    pd_gains_ratio: &pd_gains_ratio 1.0
    # Command ranges of the 2026-07-10_20-59-17 run (completed, final
    # command_vel curriculum stage). Same final stage for index 1.
    max_vel_x: &max_vel_x 0.3
    max_vel_y: &max_vel_y 0.4
    max_yaw: &max_yaw 0.45
    joystick_deadzone: &joystick_deadzone 0.05
    vel_ramp_rate: &vel_ramp_rate 0.5

    # No posture_stiffness here on purpose: the global 1600 applies.
    #
    # An earlier note pinned 8000 in every block, reasoning that the shadowed
    # overload meant 8000 was "what actually ran". Half right. The yaml path was
    # dead, but the GUI writes pt->stiffness() straight into the task and always
    # worked -- and Leo's hardware sessions set it there. His measurement: 40000
    # trembled badly on the robot, 1600 was clearly better. Pinning 8000 would
    # have overridden the value that was actually validated on hardware.
    #
    # The margin argument agrees: sqrt(K)*dt is 1.0 at 40000 and 0.20 at 1600,
    # for dt = 0.005. mc_mujoco prefers 8000 by 14% of tracking lag, but it does
    # not model the robot's communication and sensing delays, which is exactly
    # what the margin buys. The robot's verdict wins.

    # PostureTask velocity feedforward: OFF by default, and it stays off.
    #
    # Measured 2026-08-24 on two mc_mujoco logs (18-25-28, 18-27-03), K=1600
    # both sides -- the global value in mc_rtc_superbuild.yaml AND in the
    # mujoco overlay, so there is no 40000 anywhere and an earlier note here
    # claiming there was is wrong.
    #
    # Neither half is unstable alone. refVel to the QP with the servo's
    # velocity term removed (--pd-zero-ref-vel): bounded, 37 s of walking.
    # No feedforward with the servo term present: bounded, walks. BOTH: the
    # equilibrium is linearly unstable. Toggling the feedforward on a robot
    # standing still at zero command, the state grows out of rounding noise by
    # a factor ~1.38 per 5 ms tick -- 1e-4 rad/s to saturation in under 400 ms
    # -- ending at refVel pinned to its 8 rad/s clamp, qd* at 13.2 rad/s,
    # measured joint velocity 7.7 rad/s and 2399 N.m of commanded torque.
    #
    # Why: joint velocity then enters the loop twice in series. Once inside the
    # QP, where the PostureTask objective is
    #   alphaD = K*(q* - q) + D*(refVel - alpha),  D = 2*sqrt(K) = 80
    # and once in mc_mujoco's servo, kd*(alpha_ref - alpha) with kd 240-440
    # (PDgains_sim.dat). The product of the two gains leaves the stability
    # region. The real robot has only the first: RobotHardware sends position,
    # IOB's PD has no velocity reference. So this is a simulation artifact, not
    # a property of the feedforward -- but it is exactly what a default here
    # would hand to anyone launching mc_mujoco without the flag.
    #
    # It also buys nothing. Same log, walking, PostureTask eval normalised by
    # qd*: 53.5 ms of lag without the feedforward, 63.0 ms with. The lag is the
    # task's own 1/sqrt(K) = 25 ms, and qd* cannot cancel it because the EMA at
    # alpha 0.8 delays qd* by dt*a/(1-a) = 20 ms -- the correction arrives about
    # as late as the error it is meant to pre-empt.
    #
    # To test it anyway, use the GUI button (ControlMode / Toggle posture
    # feedforward), and only with --pd-zero-ref-vel.
    posture_feedforward: false


    action_scale: &action_scale
      CHEST_Y:      0.002
      CHEST_P:      0.002
      HEAD_Y:       0.002
      HEAD_P:       0.002
      L_SHOULDER_P: 0.002
      L_SHOULDER_R: 0.002
      L_SHOULDER_Y: 0.002
      L_ELBOW_P:    0.002
      L_ELBOW_Y:    0.002
      L_WRIST_R:    0.002
      L_WRIST_Y:    0.002
      R_SHOULDER_P: 0.002
      R_SHOULDER_R: 0.002
      R_SHOULDER_Y: 0.002
      R_ELBOW_P:    0.002
      R_ELBOW_Y:    0.002
      R_WRIST_R:    0.002
      R_WRIST_Y:    0.002
      L_CROTCH_Y:   0.002625
      L_CROTCH_R:   0.0075
      L_CROTCH_P:   0.0105
      L_KNEE_P:     0.0075   # policy 0's effort_limit was 100 for this joint
      L_ANKLE_R:    0.00675
      L_ANKLE_P:    0.00975
      R_CROTCH_Y:   0.002625
      R_CROTCH_R:   0.0075
      R_CROTCH_P:   0.0105
      R_KNEE_P:     0.0075 
      R_ANKLE_R:    0.00675
      R_ANKLE_P:    0.00975

    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order

  # index 1 : politique d'Hippolyte. obs_format: 2 EXPLICITE -- ce bloc etait au
  # creneau 2 et tirait son format du numero de creneau ; a la place 1 il serait
  # parti sur `case 1` (246 dims) et l'inference aurait echoue.
  - use_QP: true
    obs_format: 2
    # Velocity-action policy (mjlab JointVelocityAction + IdealPdActuator):
    # q_rl = measured joint position + action * policy_step_size, and the

    # commanded velocity is passed separately as qdTarget_. See
    # NewRLQPController::velocityAction_. torque_feasibility_ratio and
    # vel_target_filter_alpha below are position-action-only concepts and
    # are unused on this path; left in only because this block started as a
    # copy of a position-action entry.
    velocity_action: true
    #
    # --- QP-mode tuning (no effect while use_QP is false) ---
    #
    # posture_stiffness: the QP TASK's K (postureStiffness(), NOT the plant PD
    # this whole file's kp/kd maps or PDgains_sim.dat feed). Without this key
    # it falls back to 0.2/(policy_step_size*timeStep) = 0.2/(0.01*0.005) =
    # 4000 here -- a lag of 1/sqrt(K) = 15.8 ms, NOT what training saw.
    # Training modelled this exact filter (FiniteDifferencePdActuator's
    # posture_task_stiffness) at K=1600 -> 25 ms lag: set here to match the
    # plant the policy actually learned on, rather than leave it a function of
    # the control rate. Was silently dead until now: initializeRobot() and
    # applyPostureMode() called postureStiffness(), and a second, non-const
    # overload of that name (removed) shadowed the one that reads this key --
    # the override compiled, logged nothing wrong, and was never applied.
    posture_stiffness: 1600
    #
    # posture_damping: overrides the QP TASK's Kv (stiffness(K) otherwise sets
    # it automatically to 2*sqrt(K), critically damped) --
    # NewRLQPController::applyPostureDampingOverride(). NOT what the 800 rad/s
    # experiment below is about -- that one is the PLANT's damper, mc_mujoco's
    # own local PD on (q_ref, alpha_ref) (MjRobot::PD, mj_sim.cpp:30-36), read
    # from PDgains_sim.dat, a file this yaml has no key for at all. Left unset
    # (auto) here; the mechanism stays available (GUI: PostureTask > Damping)
    # for whenever the TASK's own damping is actually the thing to test.
    # posture_damping: 800
    # use_torque_task: drive the QP with a TorqueJointTask instead of the
    # PostureTask. The PostureTask route stacks two regulators -- the task,
    # then mc_mujoco's own joint PD on the (q, qdot) the QP produced -- where
    # training had one, and the QP's single coupled output cannot feed that
    # PD's two independent channels: every setting trades one for the other
    # (velocity ratio 1.00 but 61% of the position feedforward, or full
    # position bias and no holding torque at all). TorqueJointTask computes
    # tau = kp*(qd - q) + kd*(qd_dot - qdot) itself -- the training law, same
    # gains convention -- and the QP solves for the accelerations realising it
    # under the constraints.
    #
    # REQUIRES mc_mujoco started with --torque-control. Without that flag
    # sendControl() falls back to its own PD on (q_ref, alpha_ref) and every
    # torque computed here is silently discarded. Also keeps
    # dynamicsConstraint in the solver, which the kinematic route removes.
    use_torque_task: false
    #
    # qp_accel_task: hand the solver the training actuator's acceleration
    # instead of leaving it to re-derive the commanded velocity from the slope
    # of q_rl:
    #   tau   = kp*(q_rl - q_meas) + kd*(qdTarget - qdot_meas)
    #   qddot = tau / m            -> pt->refAccel()
    # Gravity and external forces are deliberately neglected: this is a
    # feedforward, not a simulation. refAccel is a native task input, so unlike
    # use_torque_task it needs no contacts and the QP stays kinematic -- the
    # output remains fully the solver's, constraints included.
    #
    # Without it, measured on the legs (bypass 1.000 in the same run):
    # velocity ratio 0.884, with the anti-windup clamp biting 36-41% of the
    # time on the knees.
    qp_accel_task: false
    #
    # joint_armature: rotor inertia added to diag(H). The mc_rtc model comes
    # from the URDF, which has none -- fd_.HIr() logs 0.00000 on every joint --
    # while the plant does: mc_mujoco's RHPS1main.xml sets armature="1" in its
    # <joint> default and mjlab's rhps1_constants.py sets armature=1.0 on every
    # actuator, so training and simulation both run with it.
    #
    # Not optional. diag(H) alone spans 13000x across the robot (L_WRIST_Y
    # 0.0003 against CHEST_P 4.26), so kp/m explodes on the light distal
    # segments: the ankles land at sqrt(kp/m)*dt = 3.9-4.6 against a stability
    # limit near 1, and the first attempt diverged exactly there (qddot
    # doubling every ~3 ticks on R_ANKLE_P, 3235 -> 17564 rad/s^2 in nine
    # ticks). With 1.0 the spread drops to 5.3x and every joint sits between
    # 0.42 and 0.68. The startup dump prints wn*dt per joint and flags anything
    # above 1 -- check it before trusting a run.
    joint_armature: 1.0
