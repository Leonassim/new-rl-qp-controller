  # default_joint_pos all match exactly). max_vel matches the run's current
  # (final) command_vel curriculum stage, read live off this run's training
  # log Curriculum/command_vel/* tags.
  #
  # Speed-dependent gait clock (2026-07-28): mjlab's gait_phase_tracking
  # switched from a single fixed frequency to interpolating the period
  # between gait_period_slow (near gait_command_threshold) and
  # gait_period_fast (at gait_command_ref) -- replaces the old gait_f_gait
  # single-frequency field, see NewRLQPController.h/utils.cpp. Values here
  # are copied directly from mjlab's gait_phase reward params, not derived.
  #
  # Torque-clamp mode: use_QP false + clip_torque true, launched with
  # mc_mujoco --torque-control. No PostureTask, no QP -- byPassQPControl()
  # writes q/alpha and the clamped torque directly, replicating mjlab's
  # FiniteDifferencePdActuator (tau = kp*(q*-q) + kd*(qd*-qd), clamped at
  # effort_limit, with the same velocity-target estimator: re-estimate on
  # target change over real elapsed time, clamp per-joint, EMA alpha 0.8).
  # effort_limit/kp/kd/action_scale/q0 all verified identical to
  # rhps1_constants.py (knees 70 N.m included).
  - use_QP: false
    clip_torque: true  # requires launching mc_mujoco with --torque-control
    policy_step_size: 0.005   # = mjlab step_dt (decimation 2 x sim timestep 0.0025)
    # mc_mujoco's MuJoCo timestep (it reports "MJ timestep: 0.001"). Only
    # used for a sanity warning against the mc_rtc timestep; it does not
    # drive control. Was 0.004, which matched nothing.
    physics_step_size: 0.001
    pd_gains_ratio: 1.0
    # Matches this checkpoint's current (iter ~5550) command_vel curriculum
    # stage, read live off Curriculum/command_vel/* -- not yet the final
    # stage (that's 0.3/0.4/0.45, reached at iter 7000).
    max_vel_x: 0.3
    max_vel_y: 0.35
    max_yaw: 0.4
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5
    gait_period_slow: 2.0
    gait_period_fast: 1.1
    gait_command_ref: 0.7
    gait_command_threshold: 0.1

    # Per-actuator-group velocity_target_limit from rhps1_constants.py
    # (RHPS1_ACTUATOR_*). A single scalar default (8.0) is wrong for
    # knees/ankles (10.0) and everything above the hip (6.0, head 4.0) --
    # only matters for clip_torque's tau = Kp*(...) + Kd*(qd_target-qd), but
