use_async_inference: false
log_timing: true
timing_log_interval: 100
# log_impact_vel: rising-edge detection on the ankle F/T sensors' Fz
# (RightFootForceSensor/LeftFootForceSensor, RHPS1main.xml's rf_force/
# lf_force sites). On touchdown, logs the ankle body's world-frame linear
# velocity (NewRLQPController_leftFootImpactVel / _rightFootImpactVel) --
# holds the last value between impacts, read it where
# NewRLQPController_{left,right}FootContact steps 0 -> 1. Raw Fz is logged
# unconditionally as NewRLQPController_{left,right}FootForceZ, needed to
# pick impact_force_threshold in the first place. This key existed in the
# yaml since the project's first commit but had no implementation behind it
# until 2026-08-20.
log_impact_vel: true
# impact_force_threshold: N on Fz, rising edge = touchdown.
impact_force_threshold: 30.0
# impact_force_hysteresis_ratio: falling-edge threshold = ratio * impact_force_threshold,
# so sensor noise straddling the threshold mid-stance does not retrigger the impact.
impact_force_hysteresis_ratio: 0.5
