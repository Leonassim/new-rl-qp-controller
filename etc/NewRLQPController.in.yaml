    - R_CROTCH_P
    - R_KNEE_P
    - R_ANKLE_R
    - R_ANKLE_P

policies:
  # index 0 : RHPS1 velocity policy -- the real-robot entry.
  #
  # use_QP true (was false, 2026-07-31): the bypass path writes torques
  # straight to the robot with nothing between the policy and the hardware --
  # acceptable in mc_mujoco, not on a machine that can break. With the QP the
  # policy's output becomes a PostureTask target and the self-collision and
  # joint-limit constraint sets stay in the loop as a safety net. No
  # torque-feasibility projection: this policy did not train with one.
  - use_QP: &use_QP true
    policy_step_size: &policy_step_size 0.005   # 200 Hz (5 ms)
    physics_step_size: &physics_step_size 0.004 # mc_mujoco at 250 Hz (4 ms)
    pd_gains_ratio: &pd_gains_ratio 1.0
    # Command ranges of the 2026-07-10_20-59-17 run (completed, final
    # command_vel curriculum stage). Same final stage for index 1.
    max_vel_x: &max_vel_x 0.3
    max_vel_y: &max_vel_y 0.4
    max_yaw: &max_yaw 0.45
    joystick_deadzone: &joystick_deadzone 0.05
    vel_ramp_rate: &vel_ramp_rate 0.5

    action_scale:
      CHEST_Y:      0.002
      CHEST_P:      0.002
      HEAD_Y:       0.002
      HEAD_P:       0.002
      L_SHOULDER_P: 0.002
      L_SHOULDER_R: 0.002
      L_SHOULDER_Y: 0.002
      L_ELBOW_P:    0.002
      L_ELBOW_Y:    0.002
      L_WRIST_R:    0.002
      L_WRIST_Y:    0.002
      R_SHOULDER_P: 0.002
      R_SHOULDER_R: 0.002
      R_SHOULDER_Y: 0.002
      R_ELBOW_P:    0.002
      R_ELBOW_Y:    0.002
      R_WRIST_R:    0.002
      R_WRIST_Y:    0.002
      L_CROTCH_Y:   0.002625
      L_CROTCH_R:   0.0075
      L_CROTCH_P:   0.0105
      L_KNEE_P:     0.0075   # policy 0's effort_limit was 100 for this joint
      L_ANKLE_R:    0.00675
      L_ANKLE_P:    0.00975
      R_CROTCH_Y:   0.002625
      R_CROTCH_R:   0.0075
      R_CROTCH_P:   0.0105
      R_KNEE_P:     0.0075
      R_ANKLE_R:    0.00675
      R_ANKLE_P:    0.00975

    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order

  # index 1 : run 2026-08-17_00-34-31, checkpoint 7200 (interim -- run still
  # training, see policy_path above).
  #
  # Back to policy 0's exact randomization, its buggy rewards fixed, and the
  # PostureTask delay filter added. This is the run that closed the
  # train/play gap seen all session: confirmed walking in both wandb videos
  # and `uv run play` on 2026-08-17.
  #
  # OBSERVATION 246 DIMS, utils.cpp case 1 (shared with the old index 4): the
  # body-only vector, no gait_phase, no raw_torque. 15+3+3+30+30+150+15 = 246.
  #
  # posture_stiffness is set here rather than in mc_mujoco's own yaml because
  # this policy trained against the second-order PostureTask filter at
  # K=1600 -- the filter is part of the plant it learned, so the stiffness is
  # a property of the policy, not of the environment. 1600 at 200 Hz and
  # 40000 at 1 kHz both give sqrt(K)*dt = 0.20 (equal numerical stability
  # margin) but not the same physical delay: delay is 1/sqrt(K), independent
  # of dt -- 25 ms at K=1600 vs 5 ms at K=40000. The policy learned 25 ms, it
  # must see 25 ms; overriding the global to 1600 here gives it that in both
  # mc_mujoco and on the robot.
  - use_QP: *use_QP
    policy_step_size: *policy_step_size
    physics_step_size: *physics_step_size
    pd_gains_ratio: *pd_gains_ratio
    posture_stiffness: 1600
    max_vel_x: *max_vel_x
    max_vel_y: *max_vel_y
    max_yaw: *max_yaw
    joystick_deadzone: *joystick_deadzone
    vel_ramp_rate: *vel_ramp_rate

    # Torque-feasibility projection (mirrors mjlab's FiniteDifferencePdActuator).
    # This policy trained WITH it, so without it here the plant differs from
    # the one it learned on -- visibly so in transients, where the
    # un-projected demand peaks.
    torque_feasibility_ratio: 1.0
    vel_target_filter_alpha: 0.8

    effort_limit:
      CHEST_Y:        120
      CHEST_P:        120
      HEAD_Y:         13
      HEAD_P:         13
      L_SHOULDER_P:   50
      L_SHOULDER_R:   50
      L_SHOULDER_Y:   50
      L_ELBOW_P:      40
      L_ELBOW_Y:      40
      L_WRIST_R:      30
      L_WRIST_Y:      30
      R_SHOULDER_P:   50
      R_SHOULDER_R:   50
      R_SHOULDER_Y:   50
      R_ELBOW_P:      40
      R_ELBOW_Y:      40
      R_WRIST_R:      30
      R_WRIST_Y:      30
      L_CROTCH_Y:     35
      L_CROTCH_R:     100
      L_CROTCH_P:     140
      L_KNEE_P:       70
      L_ANKLE_R:      45
      L_ANKLE_P:      65
      R_CROTCH_Y:     35
      R_CROTCH_R:     100
      R_CROTCH_P:     140
      R_KNEE_P:       70
      R_ANKLE_R:      45
      R_ANKLE_P:      65

    vel_target_limit_per_joint:
      CHEST_Y:        6
      CHEST_P:        6
      HEAD_Y:         4
      HEAD_P:         4
      L_SHOULDER_P:   6
      L_SHOULDER_R:   6
      L_SHOULDER_Y:   6
      L_ELBOW_P:      6
      L_ELBOW_Y:      6
      L_WRIST_R:      6
      L_WRIST_Y:      6
      R_SHOULDER_P:   6
      R_SHOULDER_R:   6
      R_SHOULDER_Y:   6
      R_ELBOW_P:      6
      R_ELBOW_Y:      6
      R_WRIST_R:      6
      R_WRIST_Y:      6
      L_CROTCH_Y:     8
      L_CROTCH_R:     8
      L_CROTCH_P:     8
      L_KNEE_P:       10
      L_ANKLE_R:      10
      L_ANKLE_P:      10
      R_CROTCH_Y:     8
      R_CROTCH_R:     8
      R_CROTCH_P:     8
      R_KNEE_P:       10
      R_ANKLE_R:      10
      R_ANKLE_P:      10

    action_scale:
      CHEST_Y:      0.002
      CHEST_P:      0.002
      HEAD_Y:       0.002
      HEAD_P:       0.002
      L_SHOULDER_P: 0.002
      L_SHOULDER_R: 0.002
      L_SHOULDER_Y: 0.002
      L_ELBOW_P:    0.002
      L_ELBOW_Y:    0.002
      L_WRIST_R:    0.002
      L_WRIST_Y:    0.002
      R_SHOULDER_P: 0.002
      R_SHOULDER_R: 0.002
      R_SHOULDER_Y: 0.002
      R_ELBOW_P:    0.002
      R_ELBOW_Y:    0.002
      R_WRIST_R:    0.002
      R_WRIST_Y:    0.002
      L_CROTCH_Y:   0.002625
      L_CROTCH_R:   0.0075
      L_CROTCH_P:   0.0105
      L_KNEE_P:     0.00525  # this run's effort_limit is 70 for this joint
      L_ANKLE_R:    0.00675
      L_ANKLE_P:    0.00975
      R_CROTCH_Y:   0.002625
      R_CROTCH_R:   0.0075
      R_CROTCH_P:   0.0105
      R_KNEE_P:     0.00525
      R_ANKLE_R:    0.00675
      R_ANKLE_P:    0.00975

    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order

use_async_inference: false
log_timing: true
timing_log_interval: 100
log_impact_vel: true
