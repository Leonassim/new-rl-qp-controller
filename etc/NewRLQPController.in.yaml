  # Run 2026-10-09_22-46-36, model_26000, reference docs/bwc_motion_v3.npz (session BWC
  # de Leo du 2026-10-09 : avant, arriere, lateral G/D, rotation G/D), etiquettes
  # nettoyees, departs debout devant chaque marche. mc_mujoco a 30 ms : 40/40 departs
  # sur 8 instants de poussee, 0 chute ; arriere -1.4 a -1.7 m, lateral +0.5 / -0.3 m,
  # rotation +70 / -65 deg en 12-15 s. Pousser le joystick >= 3 s apres l'armement.
  # Meme bloc que l'index 8, avec sa propre arm_posture.
  - use_QP: *use_QP
