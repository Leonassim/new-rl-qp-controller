---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# Note: mc_rtc always adds the robot module's minimalSelfCollisions in
# MCController; this section only appends to them. The leg-leg pairs are
# removed in the controller constructor (they block lateral stepping).
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      velocity: encoderVelocities
    # Ground-truth floating base from mc_mujoco (2026-07-29). This matches
    # mjlab, where base_lin_vel / base_ang_vel / projected_gravity are the
    # simulator's exact values -- so it is the right baseline for judging a
    # policy in simulation, and the only way to compare like-for-like.
    - type: BodySensor
      update: true
      gui: true
      bodySensor: FloatingBase
    # MCWaiko (IMU + legged odometry) disabled 2026-07-29: it was declared
    # here but never actually entered the pipeline -- mc_rtc printed
    # "Pipeline: Encoder (...) ->" with nothing after it, and loaded
    # MCWaiko.yaml without any error message. With no floating-base observer
    # at all, realRobot's base pose/velocity were never updated, so
    # projected_gravity was a constant (the policy believed itself perfectly
    # upright at all times) and base_lin_vel/base_ang_vel were dead. The
    # policy had no balance feedback whatsoever and fell immediately, in
    # both use_QP modes -- which is exactly the symptom that looked like a
    # torque-mode bug. Re-enable only once the silent drop is understood;
    # the registered observer name is correct ("MCWaiko" is in MCWaiko.so).
    # - type: MCWaiko
    #   update: true
    #   gui: true
    #   imuSensor: Accelerometer
    #   contacts:
    #     contactsDetection: Surfaces
    #     surfacesForContactDetection: [RightFootCenter, LeftFootCenter]

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Bundled policy (installed from policy/ by CMake). For local experiments you
# can point directly at a training log's ONNX instead, e.g.
# /home/<user>/mjlab-rhps1/logs/rsl_rl/rhps1_velocity/<run>/<run>.onnx
policy_path: [
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v3_2026-07-10.onnx",
  # 2026-07-29_01-13-36, iter 5550/15000 (in progress, x7 leg scale).
  # Follow-up to the 2026-07-27 checkpoint's gait-clock/std fixes, targeting
  # the residual issues seen when testing that one: action_jerk -45 -> -90
  # (visible vibration), new standing_base_motion term (L1, whole-body sway
  # at standstill -- track_linear_velocity's wide kernel and
  # standing_joint_vel's squared norm both went soft in exactly this slow-
  # drift regime, nothing penalized base translation at all before), and
  # joint_torques_l2's ANKLE_R coefficient 4.0 -> 1.5 (was taxing the same
  # ankle-roll torque that buys flat foot contact, flat_support had been
  # stuck at ~2.67/4 contacts for thousands of iterations as a result -- now
  # climbing past the session's previous best). torque_guidance_coef tried
  # at 0.3 in the same batch and reverted to 0.0 (5th reproduction of a
  # known collapse mode, see rl_cfg.py). Bundled (portable) so it can be
  # pulled and tested on another machine.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_2026-07-29_01-13-36.onnx",
  # 2026-07-20_08-37-35 (finished, x6 leg scale): best run to date -- lowest
  # pd_demand ratio ever (0.31 final) *and* better amplitude than every
  # prior run (foot speed 0.276-0.279 m/s final). Machine-local test entry.
  "/home/lmoussafir/mjlab-rhps1/logs/rsl_rl/rhps1_velocity/2026-07-20_08-37-35/2026-07-20_08-37-35.onnx",
]
