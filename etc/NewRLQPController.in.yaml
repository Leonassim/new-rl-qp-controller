  # index 3 : policy 0's network, deployment-fidelity test rig (2026-08-24).
  #
  # Purpose: bring mc_mujoco closer to what the joints actually see on the
  # robot, and measure each step of that separately. Two axes, one network:
  #
  #   QP side      refVel = qd* fed to the PostureTask, as training's PD gets
  #                it. `posture_feedforward` here; also live from the GUI
  #                (ControlMode / Toggle posture feedforward).
  #   servo side   qdot_ref = 0 at the low-level PD, as IOB has it on the
  #                robot. `mc_mujoco --pd-zero-ref-vel`, launch-time only.
  #
  # posture_stiffness 1600 is written out but changes nothing: the global value
  # is already 1600 in both mc_rtc_superbuild.yaml and the mujoco overlay. It is
  # here so the slot states its own plant instead of inheriting it silently.
  #
  # WARNING, measured: index 3 without --pd-zero-ref-vel is the unstable corner.
  # Joint velocity closes through the QP (D = 2*sqrt(K) = 80) and through
  # mc_mujoco's servo (kd 240-440) at once, and the equilibrium diverges at
  # ~1.38 per tick from rounding noise, at zero command, standing still. See
  # index 0's block for the full measurement. Run this slot WITH the flag.
  #
  # obs_format 0: same 126-dim V3 layout as index 0. Without the key the switch
  # in utils.cpp keys off the slot number and case 3 means V5, 566 dims.
  - use_QP: *use_QP
    obs_format: 0
    policy_step_size: *policy_step_size
    physics_step_size: *physics_step_size
    pd_gains_ratio: *pd_gains_ratio
    max_vel_x: *max_vel_x
    max_vel_y: *max_vel_y
    max_yaw: *max_yaw
    joystick_deadzone: *joystick_deadzone
    vel_ramp_rate: *vel_ramp_rate
    action_scale: *action_scale
    vel_target_limit_per_joint: *vel_target_limit_per_joint
    vel_target_filter_alpha: 0.8
    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order

    # The two overrides that make this slot differ from index 0, and nothing
    # else -- every other key above is an alias of index 0's, so the two blocks
    # cannot drift apart.
    # 8000, not 1600: see index 0. Every measurement ever taken on this slot,
    # including the ones logged as "1600", ran at 8000 because the config key
    # was shadowed. Pinned to what actually ran so making the key live changes
    # nothing; 1600 is now testable deliberately, from the GUI or from here.
    posture_feedforward: true

    # This slot ships with the feedforward ON, so SELECTING IT AND ARMING is
    # case C, the unstable corner -- not the neutral case. Toggle it off from
    # the GUI BEFORE arming to get the no-feedforward comparison, or just use
    # index 0, which is what that comparison reduces to.
    #
    # 4 rad/s: policy 0 walking peaks near 1.5 rad/s measured, and the runaway
    # crosses 4 well before it reaches its 8 rad/s clamp.
    runaway_disarm_vel: 4.0
    # refAccel stays off: second difference of an unfiltered target, held across
    # every substep, and training's PD has no acceleration term to match.
    posture_accel_max: 0

  # index 4 : run 2026-08-25_02-20-16 model_13800, the overnight foot-lift run.
  #
  # Same plant as index 0 -- hardware configuration, no feedforward, K 8000 --
  # so selecting it against index 0 compares the two networks and nothing else.
  # obs_format 5 : 510 dims, historique 5 sur les SEPT termes. Ce n'est plus la
  # disposition V3 a 126 dims -- l'ONNX annonce obs [1, 510] et le format a ete
  # ajoute a utils.cpp le 2026-08-27. Les reglages d'amortisseur ci-dessous sont
  # inchanges et restent justes : la run les porte tels quels (di 0.4, ds 0.01,
  # vel_percent 0.9, filtre EMA 0.8).
  #
  # runaway_disarm_vel armed: this network has never touched hardware.
  - use_QP: *use_QP
    obs_format: 5
    policy_step_size: *policy_step_size
    physics_step_size: *physics_step_size
    pd_gains_ratio: *pd_gains_ratio
    max_vel_x: *max_vel_x
    max_vel_y: *max_vel_y
    max_yaw: *max_yaw
    joystick_deadzone: *joystick_deadzone
    vel_ramp_rate: *vel_ramp_rate
    # ECHELLES PROPRES, et non l'ancre *action_scale partagee. Celle-ci porte
    # des valeurs recalculees cote deploiement a partir de limites de couple :
    # CROTCH_Y 0.002625 contre 0.003, KNEE_P 0.0075 contre 0.007, ANKLE_P
    # 0.00975 contre 0.01, six articulations sur douze. Or AUCUN onnx du
    # dossier policy/ ne porte ces valeurs, pas meme celui de la policy 0 --
    # dont un commentaire de l'ancre invoque pourtant l'effort_limit.
    #
    # L'ancre est laissee intacte : la policy 0 marche sur le robot avec, et
    # la corriger changerait l'index 0 sans mesure pour le justifier. Cet
    # index prend les echelles que son propre reseau a apprises.
    action_scale:
      CHEST_Y:      0.002
      CHEST_P:      0.002
      HEAD_Y:       0.002
      HEAD_P:       0.002
      L_SHOULDER_P: 0.002
      L_SHOULDER_R: 0.002
      L_SHOULDER_Y: 0.002
      L_ELBOW_P:    0.002
      L_ELBOW_Y:    0.002
      L_WRIST_R:    0.002
      L_WRIST_Y:    0.002
      R_SHOULDER_P: 0.002
      R_SHOULDER_R: 0.002
      R_SHOULDER_Y: 0.002
      R_ELBOW_P:    0.002
      R_ELBOW_Y:    0.002
      R_WRIST_R:    0.002
      R_WRIST_Y:    0.002
      L_CROTCH_Y:   0.003
      L_CROTCH_R:   0.007
      L_CROTCH_P:   0.01
      L_KNEE_P:     0.007
      L_ANKLE_R:    0.007
      L_ANKLE_P:    0.01
      R_CROTCH_Y:   0.003
      R_CROTCH_R:   0.007
      R_CROTCH_P:   0.01
      R_KNEE_P:     0.007
      R_ANKLE_R:    0.007
      R_ANKLE_P:    0.01
    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order
    runaway_disarm_vel: 4.0

    # The velocity damper, and the qd* it reads. NOT optional here, and leaving
    # it out is what made this policy fall forward on the first mc_mujoco test:
    # index 0's block was copied wholesale, and policy 0 has no damper because
    # policy 0 trained without one. This run did -- Curriculum/velocity_damper
    # sat at 1.0 for its whole length, params/env.yaml records di 0.4, ds 0.01,
    # vel_percent 0.9 -- so deployment was running the network against a plant
    # missing the stage mjlab puts between qd* and the target. Undamped, the
    # commanded target moves faster than anything the policy ever saw, and on a
    # forward command the QP chases a target running out ahead of the robot.
    #
    # applyVelocityDamper() also clamps qd*, so the two parameters that define
    # qd* have to match training too: EMA 0.8 and the per-joint limit. Their
    # fallbacks are 0.0 (no filter) and 1e9 (no clamp).
    # AMORTISSEUR INACTIF, et c'est ce que l'entrainement fait. Le curriculum
    # velocity_damper monte de 0 a 1 entre les pas 360000 et 612000, soit les
    # iterations 15000 a 25500 ; cette lignee tourne autour de 2500, donc
    # Curriculum/velocity_damper vaut 0.0000 et l'actionneur calcule
    # di = progress * 0.4 = 0. Deployer di 0.4 fait tourner la politique contre
    # un etage de bridage qu'elle n'a jamais vu -- symetrique exact de l'erreur
    # de 2026-08-13, ou l'amortisseur MANQUAIT au deploiement.
    velocity_damper_di: 0.0
    velocity_damper_ds: 0.01
    velocity_damper_vel_percent: 0.9
    # Ces deux-la restent actifs a l'entrainement quoi qu'il arrive :
    # velocity_target_filter_alpha 0.8 et velocity_target_limit 8.0 rad/s, ce
    # dernier applique hors de l'amortisseur (finite_difference_pd_actuator.py,
    # le clamp precede la porte velocity_damper_progress).
    vel_target_filter_alpha: 0.8
    vel_target_limit_per_joint: *vel_target_limit_flat8
    # Required by the damper, and their absence is a hard throw, not a default:
    # a joint left at lo == hi would be skipped silently, i.e. one joint on a
    # different plant from the other 29. Missing them is why switching to this
    # index failed outright instead of misbehaving.
    joint_limits: *joint_limits
    velocity_limits: *velocity_limits

  # index 5 : run 2026-08-25_18-30-00 model_15600.
