    # Jambes : les valeurs EXACTES du run (params/env.yaml), identiques a
    # l'ancre *action_scale. Elles ont ete arrondies ici -- 0.003 pour 0.002625,
    # 0.007 pour 0.0075, 0.01 pour 0.0105 -- parce que les metadonnees de l'ONNX
    # les portaient ainsi : l'exportateur mjlab formatait en %.3f, ce qui ne
    # laisse qu'un ou deux chiffres significatifs sur des valeurs en 1e-3.
