  # index 1 : run 2026-08-05_11-17-44 ("abl15") -- the raw-torque campaign.
  # First policy trained with the pre-clamp PD demand both as an observation
  # channel and as the penalised quantity (log1p(max(0, ratio - 1)), curriculum
  # -0.05 -> -1.50). Everything else is abl7's configuration, unchanged.
  #
  # THIS INDEX USES THE V5 OBSERVATION (566 dims). utils.cpp case 1 builds it by
  # falling through the V4 body and appending one block:
  #   raw_torque[300] = 10x30, |tau_raw| / effort_limit per joint, history 10.
  # 266 + 300 = 566. Index 2 stays on V4 (266) and index 0 on V3 (126).
  #
  # The channel is measured on the target BEFORE the projection. Measuring it
  # after makes every joint report exactly torque_feasibility_ratio -- the
  # projection measuring itself, which is what the training bug did until an
  # assertion caught it at 1.0000 on 100% of joints.
  #
  # action_scale, q0, kp, kd, effort_limit and vel_target_limit_per_joint are
  # identical to index 2: verified against the run's own params/env.yaml and the
