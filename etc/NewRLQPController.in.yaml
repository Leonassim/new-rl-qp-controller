---
Managed: false
StepByStep: true
IdleKeepState: false
StatesLibraries:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@"
StatesFiles:
- "@MC_STATES_DEFAULT_RUNTIME_INSTALL_PREFIX@/data"
- "@MC_STATES_RUNTIME_INSTALL_PREFIX@/data"
VerboseStateFactory: false

robots:
  ground:
    module: env/ground

# This block is the ONLY thing that actually puts a self-collision constraint
# in the solver: MCController.cpp:322-331 builds a CollisionsConstraint from
# the "collisions" key and calls solver().addConstraintSet() on it. The
# selfCollisionConstraint member tweaked in NewRLQPController's constructor
# (thigh iDist correction, setCollisionsDampers) is a SEPARATE object that is
# never added to the solver, so editing it there changes nothing -- and
# commenting this block out is what actually disables the protection.
#
# Briefly disabled on 2026-08-07 to test whether self-collision explained the
# QP-vs-bypass gap. It did not; restored.
collisions:
- type: collision
  useMinimal: true

ObserverPipelines:
- name: Pipeline
  observers:
    - type: Encoder
      # The real robot publishes no encoder velocities, only positions, and
      # EncoderObserver::run error_and_throw's on the empty vector, which
      # deactivates MCControl mid-run. mc_mujoco does publish them, so this
      # only ever showed up on hardware. Finite differences work on both.
      velocity: encoderFiniteDifferences
    # WAIKO estimator: IMU + legged odometry (no QP contacts needed).
    # imuSensor must be the real IMU (Accelerometer, gyro+accelero at the imu
    # site) -- FloatingBase is the mc_mujoco ground-truth pose sensor.
    # filterGains/leggedOdometry come from the installed default MCWaiko.yaml.
    - type: MCWaiko
      update: true
      gui: true
      imuSensor: Accelerometer
      contacts:
        contactsDetection: Surfaces
        surfacesForContactDetection: [RightFootCenter, LeftFootCenter]
    # Ground-truth fallback (mc_mujoco perfect pose), for comparison:
    # - type: BodySensor
    #   update: true
    #   gui: true
    #   bodySensor: FloatingBase

states: {}
transitions:
- [NewRLQPController_Initial, OK, NewRLQPController_Initial, Strict]
init: NewRLQPController_Initial

# Every policy is BUNDLED: the files live in policy/ and CMake installs the whole
# directory to @RL_POLICY_INSTALL_PREFIX@. No absolute path to anyone's home, so
# a clone + build on the robot PC has the policies without needing mjlab-rhps1
# checked out anywhere. Adding one is: drop the .onnx in policy/, add a line here
# and a matching policies[] block.
#
# For a local experiment you can still point an entry at a training log's ONNX,
# e.g. /home/<user>/mjlab-rhps1/logs/rsl_rl/rhps1_velocity/<run>/<run>.onnx --
# but do not commit that, it breaks every other machine.
#
# ONLY INDEX 0 HAS EVER RUN ON HARDWARE (2026-08-06). Indices 1, 2 and 3 are
# simulation-validated at best; 1 and 3 use an observation channel whose C++
# implementation has never been exercised on the robot. Arm from the GUI, keep a
# hand on the stop.
policy_path: [
  # index 0: V3 (126 dims), the conservative policy that walked on the robot.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v3_2026-07-10.onnx",
  # index 1: abl15 at iteration 10050 -- the raw-torque campaign's best trade.
  # V5 observation (566 dims), see policies[1] and utils.cpp case 1. NOT the run's
  # final checkpoint: iterations 10000 -> 15000 bought 2.6% of peak torque for
  # three times the falls, so this one was re-exported on purpose with
  # mjlab-rhps1 scripts/tools/export_onnx.py.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v5_abl15_it10050.onnx",
  # index 2: abl7, the union of every validated deviation. V4 (266 dims).
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v4_abl7_2026-08-01.onnx",
  # index 3: abl15 at its final iteration 14999, same V5 format as index 1.
  # Kept for comparison -- lower peak torque, three times the falls.
  "@RL_POLICY_INSTALL_PREFIX@/rhps1_velocity_v5_abl15_it14999.onnx",
  # index 4: hippolyte's velocity policy with history 40
  "@RL_POLICY_INSTALL_PREFIX@/2026-08-16_22-14-14.onnx"


]
# Stays 0: the real-robot entry is the only one with hardware time behind it.
default_policy_index: 4

# N*Kt par joint, pour convertir en N.m ce que le robot mesure.
#
# Ce que RobotHardware publie sur `tau` n'est PAS un couple sur RHPS1 : le VRML
# donne gearRatio = 1 et torqueConst = 1 sur les 62 joints, donc la valeur vaut
# ratedCurrent * 0x6077/1000, soit un COURANT en amperes. Le controleur
# journalise les deux : NewRLQPController_joint_current (A, brut) et
# NewRLQPController_joint_torque (N.m, = courant * la valeur ci-dessous).
#
# Source : scripts/ppc/joint_torque_limits_rotate.csv, lignes type=solo,
# remappees le 2026-08-03 apres correction du bug d'association Drive<->joint.
#
# Volontairement limite aux six joints a moteur unique. Les paires
# differentielles (epaule R/Y, coude P/Y, poignet P/Y, chest, head) ont un N
# mais aucun Kt par articulation, et les articulations a verins (crotch P/R,
# ankle P/R) ont un bras de levier variable qui demande CylinderToAngle. Les
# joints absents d'ici restent a 0 dans le log plutot que d'etre convertis
# avec un facteur invente.
joint_torque_scale:
  L_CROTCH_Y:    9.259   # 159.0907 * 0.0582
  R_CROTCH_Y:    9.259   # 159.0907 * 0.0582
  L_KNEE_P:     21.210   # 210.0    * 0.101
  R_KNEE_P:     21.210   # 210.0    * 0.101
  L_SHOULDER_P:  9.400   # 200.0    * 0.047
  R_SHOULDER_P:  9.400   # 200.0    * 0.047

policies:
  # index 0 : RHPS1 velocity policy
  #
  # use_QP true (was false, 2026-07-31): this index is the real-robot entry.
  # The bypass path writes torques straight to the robot with nothing between
  # the policy and the hardware -- acceptable in mc_mujoco, not on a machine
  # that can break. With the QP the policy's output becomes a PostureTask
  # target and the self-collision and joint-limit constraint sets stay in the
  # loop as a safety net.
  - use_QP: true
    policy_step_size: 0.005   # 200 Hz (5 ms)
    physics_step_size: 0.004  # mc_mujoco at 250 Hz (4 ms)
    pd_gains_ratio: 1.0
