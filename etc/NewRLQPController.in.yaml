      L_WRIST_Y:    14000.0
      L_HAND:       1.0
      R_SHOULDER_P: 15000.0
      R_SHOULDER_R: 14000.0
      R_SHOULDER_Y: 14000.0
      R_ELBOW_P:    14000.0
      R_ELBOW_Y:    14000.0
      R_WRIST_P:    14000.0   # valeur RHPS1 de R_WRIST_R
      R_WRIST_Y:    14000.0
      R_HAND:       1.0
    kd: &rhp7_kd
      L_CROTCH_Y:   400.0
      L_CROTCH_R:   400.0
      L_CROTCH_P:   400.0
      L_KNEE_P:     400.0
      L_ANKLE_R:    300.0
