  # index 3 : policy 0's network, deployment-fidelity test rig (2026-08-24).
  #
  # Purpose: bring mc_mujoco closer to what the joints actually see on the
  # robot, and measure each step of that separately. Two axes, one network:
  #
  #   QP side      refVel = qd* fed to the PostureTask, as training's PD gets
  #                it. `posture_feedforward` here; also live from the GUI
  #                (ControlMode / Toggle posture feedforward).
  #   servo side   qdot_ref = 0 at the low-level PD, as IOB has it on the
  #                robot. `mc_mujoco --pd-zero-ref-vel`, launch-time only.
  #
  # K=1600 is NOT optional here. The PostureTask objective is
  #   alphaD = K*(q* - q) + D*(refVel - alpha) + refAccel,  D = 2*sqrt(K)
  # so refVel is multiplied by D. At the mc_mujoco default K=40000, D=400 and
  # the feedforward flails the legs (2026-08-24). At 1600, D=80 -- five times
  # gentler, and it is the value already tested on this robot.
  #
  # obs_format 0: same 126-dim V3 layout as index 0. Without the key the switch
  # in utils.cpp keys off the slot number and case 3 means V5, 566 dims.
  - use_QP: *use_QP
    obs_format: 0
    policy_step_size: *policy_step_size
    physics_step_size: *physics_step_size
    pd_gains_ratio: *pd_gains_ratio
    max_vel_x: *max_vel_x
    max_vel_y: *max_vel_y
    max_yaw: *max_yaw
    joystick_deadzone: *joystick_deadzone
    vel_ramp_rate: *vel_ramp_rate
    action_scale: *action_scale
    vel_target_limit_per_joint: *vel_target_limit_per_joint
    vel_target_filter_alpha: 0.8
    kp: *kp
    kd: *kd
    q0: *q0
    ref_joint_order: *ref_joint_order

    # The two overrides that make this slot differ from index 0, and nothing
    # else -- every other key above is an alias of index 0's, so the two blocks
    # cannot drift apart.
    posture_stiffness: 1600
    posture_feedforward: true
    # refAccel stays off: second difference of an unfiltered target, held across
    # every substep, and training's PD has no acceleration term to match.
    posture_accel_max: 0

use_async_inference: false
log_timing: true
timing_log_interval: 100
# log_impact_vel: rising-edge detection on the ankle F/T sensors' Fz
# (RightFootForceSensor/LeftFootForceSensor, RHPS1main.xml's rf_force/
# lf_force sites). On touchdown, logs the ankle body's world-frame linear
# velocity (NewRLQPController_leftFootImpactVel / _rightFootImpactVel) --
# holds the last value between impacts, read it where
# NewRLQPController_{left,right}FootContact steps 0 -> 1. Raw Fz is logged
# unconditionally as NewRLQPController_{left,right}FootForceZ, needed to
# pick impact_force_threshold in the first place. This key existed in the
# yaml since the project's first commit but had no implementation behind it
# until 2026-08-20.
log_impact_vel: true
# impact_force_threshold: N on Fz, rising edge = touchdown.
impact_force_threshold: 30.0
# impact_force_hysteresis_ratio: falling-edge threshold = ratio * impact_force_threshold,
# so sensor noise straddling the threshold mid-stance does not retrigger the impact.
impact_force_hysteresis_ratio: 0.5
