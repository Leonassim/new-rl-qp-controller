    # settle hold, first inference seeded with the matching last action.
    # Measured in mc_mujoco (index 9 = P model_26000, command 0, 3.5-5.5 s after
    # arming, target std 0.011 deg). Ramping to q0 instead made the first
    # inference jump the target 6.6 deg and shake for 2-3 s.
