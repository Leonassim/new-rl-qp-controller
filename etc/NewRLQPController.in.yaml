  # index 2 : run 2026-08-01_14-55-55 ("abl7") -- the union of every validated
  # deviation: torque-feasibility projection at ratio 1.0, executed_action,
  # velocity-target EMA 0.8, pd_demand_excess -0.02 (band 0.7/4.0), and
  # history_length 5 on actions and gait_phase.
  #
  # THIS INDEX USES THE V4 OBSERVATION (266 dims). utils.cpp case 2 builds it;
  # indices 0 and 1 stay on V3 (126). Two blocks differ from V3 and one is new:
  # actions is 5x30 instead of 30, and gait_phase (5x4) does not exist in V3 at
  # all -- so no V3-era controller can drive this policy, it would silently feed
  # 126 numbers to a 266-input network.
  #
  # Leg action_scale is 4.67x the index-0 values (e/kp * _LEG_SCALE_MULTIPLIER,
  # 7.0) and q0 is the straighter-knee keyframe actually used in training
  # (CROTCH_P -0.196, KNEE_P 0.487, ANKLE_P -0.291 vs -0.271/0.622/-0.351).
