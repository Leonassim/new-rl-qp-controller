    # KNEES_BENT_KEYFRAME du run d'entrainement (fourni par l'auteur), en
    # precision pleine. Recoupe valeur par valeur avec les metadonnees
    # `default_joint_pos` de l'ONNX (run 2026-08-23_21-06-44), qui les arrondit
    # a 3 decimales -- les 12 entrees non nulles concordent.
    #
    # VOLONTAIREMENT PAS recopie de RHPS1, contrairement a kp/kd/effort_limit :
    # q0 n'est pas un reglage, il DEFINIT L'OBSERVATION. utils.cpp case 2
    # alimente le reseau avec
    #   jointPosDeep_[0](j) = q_mesure - q_zero(j)
    # c'est-a-dire le joint_pos_rel de mjlab. Une erreur sur q0 est un biais
    # constant sur l'entree du reseau, pas un simple decalage de posture.
    # L'ecart aux valeurs RHPS1 etait majeur : ELBOW_P -80 deg contre -30 deg,
    # soit 0.87 rad de biais permanent.
    #
    # A noter : cette pose met CROTCH_R et ANKLE_R exactement a 0, la ou RHPS1
    # les ouvre a +/-0.029 / -+0.031.
    q0:
      CHEST_Y:      0.0         # 0 deg
      CHEST_P:      0.0         # 0 deg
      HEAD_Y:       0.0         # absent du keyframe -> defaut 0, confirme par l'ONNX
      HEAD_P:       0.0         # idem
      L_SHOULDER_P: 0.523599    # 30 deg
      L_SHOULDER_R: 0.174533    # 10 deg
      L_SHOULDER_Y: -0.087266   # -5 deg
      L_ELBOW_P:    -1.396263   # -80 deg
      L_ELBOW_Y:    0.0
      L_WRIST_P:    0.0
      L_WRIST_Y:    0.0
      L_HAND:       0.0
      R_SHOULDER_P: 0.523599    # 30 deg
      R_SHOULDER_R: -0.174533   # -10 deg
      R_SHOULDER_Y: 0.087266    # 5 deg
      R_ELBOW_P:    -1.396263   # -80 deg
      R_ELBOW_Y:    0.0
      R_WRIST_P:    0.0
      R_WRIST_Y:    0.0
      R_HAND:       0.0
      L_CROTCH_Y:   0.0         # 0 deg
      L_CROTCH_R:   0.0         # 0 deg
      L_CROTCH_P:   -0.296706   # -17 deg
      L_KNEE_P:     0.628319    # 36 deg
      L_ANKLE_R:    0.0         # 0 deg
      L_ANKLE_P:    -0.331613   # -19 deg
      R_CROTCH_Y:   0.0
      R_CROTCH_R:   0.0
      R_CROTCH_P:   -0.296706   # -17 deg
      R_KNEE_P:     0.628319    # 36 deg
      R_ANKLE_R:    0.0
      R_ANKLE_P:    -0.331613   # -19 deg

    # Ordre des joints ATTENDU PAR LE RESEAU (pas celui du robot). Repris de
    # l'ordre des actionneurs de RHP7_ARTICULATION (rhp7_constants.py), qui suit
    # le meme motif que l'ONNX RHPS1 verifie : chest, head, bras G, bras D,
    # jambe G, jambe D. A confirmer contre `joint_names` de l'ONNX -- une
    # permutation ici est silencieuse et enverrait chaque commande au mauvais
    # joint.
    ref_joint_order: &rhp7_ref_joint_order
      - CHEST_Y
      - CHEST_P
      - HEAD_Y
      - HEAD_P
      - L_SHOULDER_P
      - L_SHOULDER_R
      - L_SHOULDER_Y
      - L_ELBOW_P
      - L_ELBOW_Y
      - L_WRIST_P
      - L_WRIST_Y
      - L_HAND
      - R_SHOULDER_P
      - R_SHOULDER_R
      - R_SHOULDER_Y
      - R_ELBOW_P
      - R_ELBOW_Y
      - R_WRIST_P
      - R_WRIST_Y
      - R_HAND
      - L_CROTCH_Y
      - L_CROTCH_R
      - L_CROTCH_P
      - L_KNEE_P
      - L_ANKLE_R
      - L_ANKLE_P
      - R_CROTCH_Y
      - R_CROTCH_R
      - R_CROTCH_P
      - R_KNEE_P
      - R_ANKLE_R
      - R_ANKLE_P

  # index 7 : RHP7 Kaleido, rhp7test -- IDENTIQUE a l'index 6 (meme reseau, meme
  # plant) sauf q0 : au lieu du q0 du run d'entrainement (bras a 30/-80 deg),
  # utilise le _stance du module robot mc_rhp7 (rhp7.cpp:48-79) -- la pose ou
  # le robot se tient AVANT l'armement (cf. reset(), qui ne pousse jamais q_rl
  # a la PostureTask avant policyArmed_==true). Jambes/chest/tete identiques
  # dans les deux (coincidence : le run d'entrainement et le _stance du module
  # partagent CROTCH_P -17 deg, KNEE_P 36 deg, ANKLE_P -19 deg) ; seuls les
  # bras different (SHOULDER_P 15 au lieu de 30, ELBOW_P -30 au lieu de -80).
  # But : tester si demarrer le reseau depuis la pose de repos plutot que
  # depuis son propre q0 d'entrainement change le comportement au moment de
  # l'armement.
  - use_QP: true
    obs_format: 5
    velocity_action: true
    use_torque_task: false
    qp_accel_task: false
    joint_armature: 1.0
    policy_step_size: 0.01   # 100 Hz (10 ms)
    physics_step_size: 0.0025  # mc_mujoco a 400 Hz (2.5 ms)
    pd_gains_ratio: 1.0
    max_vel_x: 0.3
    max_vel_y: 0.2
    max_yaw: 0.45
    joystick_deadzone: 0.05
    vel_ramp_rate: 0.5
    torque_feasibility_ratio: 1.0
    vel_target_filter_alpha: 0.8
    effort_limit: *rhp7_effort_limit
    vel_target_limit_per_joint: *rhp7_vel_target_limit_per_joint
    action_scale: *rhp7_action_scale
    kp: *rhp7_kp
    kd: *rhp7_kd

    # _stance du module mc_rhp7 (rhp7.cpp:48-79), converti en radians -- PAS
    # le q0 du run d'entrainement (voir le bloc de l'index 6 pour celui-la et
    # pourquoi q0 definit l'observation, pas juste une posture).
    q0:
      CHEST_Y:      0.0         # 0 deg
      CHEST_P:      0.0         # 0 deg
      HEAD_Y:       0.0         # 0 deg
      HEAD_P:       0.0         # 0 deg
      L_SHOULDER_P: 0.261799    # 15 deg
